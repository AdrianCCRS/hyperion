# Tamizaje V1b (politica CPU memory-bound, post-mortem de V1, 2026-09-22): mide stall_mem_ratio y mpki
# reales de las mismas 15 familias RAJAPerf de V1, redimensionadas a --memory-touched 125829120 (10x la
# LLC de paccaA100), el mismo tamano usado para las familias de streaming de entrenamiento. Solo REF, solo
# PMU: no mide EDP ni niveles de frecuencia. Decide que familias caen a cada lado de la regla sellada
# corregida (stall_mem_ratio>=0.30 AND mpki>=20 -> F2) antes de invertir en el barrido de niveles.
#
# Motivo de esta ronda: V1 (screening a --repfact, tamano por defecto de RAJAPerf, cabe en LLC de 8 MiB)
# fue refutada -- ver docs/libro/datos/cpu_calidad_30fam/politica/v1_prueba_sellada/v1_resultado.json.
# El post-mortem encontro que el stall alto medido en V1 venia de latencia L2/L3 o atomics (mpki~0), no de
# trafico real a DRAM: exactamente el regimen que la regla NO debia capturar. Ninguno de estos 15 kernels
# entra a entrenamiento del clasificador (30 familias, decision cerrada).
