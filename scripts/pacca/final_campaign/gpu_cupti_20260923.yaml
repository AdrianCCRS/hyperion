# Campana GPU con CUPTI Activity (etiqueta OI online por-lanzamiento) --
# midiendo con CUPTI Activity en vez de ncu offline (decision-cupti-online-
# oi-por-lanzamiento): reemplaza la etiqueta constante por corrida (ncu
# offline, un solo OI representativo de toda la corrida) por OI real por
# lanzamiento de kernel CUDA, prorrateado por ventana temporal
# (fase1_telemetria/gpu_phases.py::granularity_contract, row_unit=
# "time_window"). H1 (candado de reloj GPU averiado) reparado por el
# administrador el 2026-09-23 (reset via nvidia-smi -rgc +
# nvidia-bug-report) y validado con nuestro propio flujo
# (hyp_gpu_freq_validate_h1.sbatch, job 7579: 1410/810/210 MHz aplicados y
# confirmados exactos bajo carga real sostenida).
#
# gpu.activity_trace.enabled=true activa --cupti-activity-lib en el
# launcher (fase1_telemetria/runner.py::build_command) y exige
# cupti_activity_exec_path/binary_checksum poblados en el catalogo para
# cada kernel dataset de GPU (verify_cupti_activity_binary, F1-GPU-004),
# ADEMAS de un modelo analitico registrado en gpu_oi_models.py y sus
# parametros explicitos en gpu.activity_trace.parameters_by_kernel
# (fase1_telemetria/audit_gpu_oi_coverage.py::require_complete, fail-closed
# antes de tocar hardware). Los 19 kernels de abajo son EXACTAMENTE los que
# tienen las tres cosas: cupti_activity_exec_path/checksum en catalog.yaml,
# modelo en gpu_oi_models.registered_kernel_refs(), y parametros aqui.
# NO es el mismo conjunto de 19 de gpu_final.yaml (ncu offline,
# pacca_gpu_final_20260913): ese tenia rodinia_lavamd/rodinia_dwt2d, que
# NUNCA recibieron modelo analitico CUPTI; el conjunto CUPTI-listo cambia
# esos dos por minibude_cuda_bm1 (que sí lo tiene). Confirmado 2026-09-23
# comparando catalog.yaml contra gpu_oi_models.registered_kernel_refs().
#
# Parametros derivados de fuente real, no adivinados (2026-09-23):
# - size/elements/n_points/etc: de exec_args del catalogo cuando existen.
# - gpu_cutlass_simt_conv2d (n,h,w,c,k,r,s,p,q): leidos directo de
#   kernels/gpu/cutlass_simt_conv2d_bench.cu (defaults sin --n/--h/etc en
#   exec_args; p,q=64 derivados de la formula de Conv2dProblemSize con
#   pad=1,stride=1,dilation=1,R=S=3, confirmada contra el codigo).
# - minibude_cuda_bm1 (poses/proteins/ligands/forcefields): leidos del
#   propio stdout real de una corrida ya aceptada
#   (gpu_minibude_extra_20260916, deck bm1: poses=65536, proteins=938,
#   ligands=26, forcefields=34) -- no del binario ni de una fuente externa.
# - rodinia_heartwall (points/template_side/search_side/frame_bytes): de
#   rodinia-src/cuda/heartwall/{define.c,main.cu} (ALL_POINTS=51,
#   sSize=40/tSize=25 -> search_side=2*40+1=81, template_side=25+1+25=51)
#   + dimensiones reales de data/heartwall/test.avi via ffprobe (128x128,
#   fp=float de 4B -> frame_bytes=128*128*4=65536).
# - Los 4 kernels RAJAPerf (elements/side/ni,nj,nk): RAJAPerf no expone
#   estos por --sizefact directamente -- se resolvieron reproduciendo la
#   formula real de cada kernel (RAJAPerf/src/{stream/TRIAD.cpp,
#   polybench/POLYBENCH_{JACOBI_2D,HEAT_3D,GEMM}.cpp} +
#   common/RunParams.hpp::getTargetSize, target_size=default*sizefact):
#     stream_triad (sizefact=400): elements = 1e6*400 = 400000000
#     jacobi_2d    (sizefact=400): m_N = sqrt(1e6*400)+2+sqrt(2)-1 = 20002
#     heat_3d      (sizefact=400): m_N = cbrt(1e6*400)+2+cbrt(3)-1 = 739
#     gemm         (sizefact=250): ni=nj=sqrt(1e6*250)+sqrt(2)-1=15811,
#                                  nk=int(1200/1000*ni)=18973
#
# catalog_path apunta al catalogo VIVO del repo, no a un snapshot de
# cribado congelado (el snapshot de pacca_screen_20260909 es anterior a
# que estos campos CUPTI existieran) -- verify_binary()/
# verify_cupti_activity_binary() revalidan el checksum contra el binario
# real en CADA corrida (CAT-07), asi que cualquier deriva entre el
# catalogo vivo y lo que se probo antes falla ruidosamente por corrida, no
# en silencio.
#
# output_dir NUEVO (nunca el de gpu_final.yaml): son mediciones con un
# instrumento distinto (CUPTI online vs ncu offline), no continuacion de
# la misma campana -- mismo criterio que ya establecio CAM-09 para
# rodinia_kmeans/gpu_cutlass_simt_conv2d en la cabecera de gpu_final.yaml.
