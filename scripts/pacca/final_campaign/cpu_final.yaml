catalog_path: /home/latorresn/hyperion-results/screening/pacca_screen_20260909/config/catalog.screening.yaml
calibration:
- kernel_ref: stream_official
- kernel_ref: ert_probe
# F1-CPU-004 (2026-09-14): cpu_gap_bfs/ptrchase excluidos -- latency-bound
# (log2(OI/ridge) ~ -26.7), fuera de dominio del modelo Roofline FLOPs/bytes,
# ningun barrido de tamano/frecuencia los va a mover. Ver Seguimiento.
#
# cpu_rajaperf_lcals_tridiag_elim/basic_init3 (F1-CPU-006, 2026-09-14):
# RE-INCLUIDOS. Estaban excluidos porque su duracion base era mas corta que
# su propio warmup real (2.3-3.6s, F1-XDEV-005) -- 0 ventanas 'ok'
# garantizado. Arreglado con `exec_args: "--repfact <F>"` en el catalogo:
# multiplica las repeticiones de RAJAPerf sin tocar --memory-touched (el
# tamano/OI que ya paso el tamizaje v2, alpha<0.226) -- confirmado leyendo
# el CSV de salida de RAJAPerf, BytesTouched/rep no cambia con repfact.
# Verificado con smoke test real en REF y F8 (la frecuencia mas lenta):
# 12/12 aceptadas, 0 rechazadas.
#
# dual_* (F1-XDEV-001, actualizacion 2026-09-14): cuarentena levantada tras
# inspeccionar fuente -- gemm/cholesky/fft/stencil/axpy limpios (llaman
# OpenBLAS/LAPACK/FFTW reales o implementan el algoritmo directo, sin
# atajos). dual_spmv habilitado CON RESERVA: su "matriz dispersa" es una
# banda fija sintetica (7 no-ceros/fila, i+-3 mod N), no acceso irregular
# real -- documentar asi si se reporta. Se anaden 2 tamanos adicionales por
# familia (ademas del que ya tenia el cribado) para densificar la franja
# cerca del ridge, hoy sostenida casi solo por npb_bt/npb_lu.
#
# hpccg_cpu_N46 (F1-CPU-009, 2026-09-14): kernel NUEVO (CG sobre
# Laplaciano 3D de 7 puntos, implementacion propia -- ver
# kernels/hpccg/hpccg_cg_cpu_bench.c). Tercera ancla real cerca del ridge
# de la sesion (66.3% cerca del ridge en smoke REF, junto a
# dual_cholesky_cpu_N1024 87.6% y dual_stencil_cpu_N512 67.2%).
# Verificado con smoke test real en REF y F8 (turbo desactivado): 6/6
# aceptadas, 0 rechazadas. lbm_cpu (LBM D2Q9-BGK, tambien nuevo esta
# sesion) se probo con 13 tamanos y NO entra -- salto de cache abrupto sin
# banda cerca del ridge en ningun tamano, ver F1-CPU-008.
