# Campana final de barrido de frecuencia -- CPU (Plan_Detallado §2.4).
#
# EDITABLE HASTA QUE EL JOB ARRANQUE. El wrapper (hyp_final_cpu.sbatch) lee
# este archivo en tiempo de ejecucion y NO lo regenera: para sacar un kernel
# basta borrar su linea `- kernel_ref: X` de la lista `kernels`. No hace
# falta reconstruir ni re-someter nada, el puesto en la cola se conserva.
#
# CONVENCION DE NIVELES: el indice F* es relativo al numero de niveles de la
# campana (el cribado GPU usa F0-F6 para 7 niveles, el CPU uso F0-F4 para 5).
# Aqui hay 9 niveles fijos, asi que:
#     F0 = 1.000 (maximo)   F4 = 0.500 (medio)   F8 = 0.000 (minimo)
# OJO: F2/F4 NO significan lo mismo que en el manifiesto de cribado
# (alli F2=0.5 y F4=0.0). No cruzar IDs entre campanas; usar `fraction`.
campaign_id: pacca_cpu_final_20260913
warmup_seconds_override: 0.0
environment_tier: hpc_sc3
seed: 20260913
output_dir: /home/latorresn/hyperion-results/final/campaigns/cpu
