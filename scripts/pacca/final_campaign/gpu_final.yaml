# Campana final de barrido de frecuencia -- GPU (Plan_Detallado §2.4).
#
# PRERREQUISITO DURO (Plan §2.4.1): este barrido NO es valido sin haber
# medido antes T_transicion_gpu. Eso lo produce la etapa `transition` de la
# cadena de cribado (job 7055). Por eso el wrapper se somete con
# --dependency=afterok sobre el ultimo job del cribado.
#
# EDITABLE HASTA QUE EL JOB ARRANQUE. El wrapper (hyp_final_gpu.sbatch) lee
# este archivo en tiempo de ejecucion y NO lo regenera: para sacar un kernel
# basta borrar su linea `- kernel_ref: X`. No hace falta re-someter nada.
#
# ⚠️ COSTO: el motor corre el PRODUCTO CRUZADO frequency_levels x
# gpu_frequency_levels. Tal como esta: 1 nivel CPU x 10 niveles GPU x 23
# kernels x 3 reps = 690 corridas (~39 h al ritmo medido).
#
# DECISION 2026-09-13: la CPU se deja SOLO en REF. La campana GPU previa
# (288 combos, ARC-170) ya incluyo un nivel de CPU al minimo y con eso
# demostro que bajar el reloj de CPU si degrada el rendimiento; esa pregunta
# quedo contestada y re-medirla aqui costaria ~39 h extra sin refinar la
# tabla de politica de GPU. Ademas REF-solo es el control mas limpio: aisla
# el efecto del reloj de GPU sin confundirlo con un cambio simultaneo de CPU.
# Consecuencia a tener presente: la medida defensiva del daemon (Plan §4.1,
# "forzar CPU al minimo mientras gpu_util_pct reporte actividad") tendra que
# citar la campana previa en Fase 4, no datos de esta. Al citarla, verificar
# que sea POSTERIOR al 2026-08-19 (antes de esa fecha los datos GPU corrieron
# en modo spin por el bug del shim de blocking-sync).
#
# CONVENCION DE NIVELES: el indice F* es relativo al numero de niveles.
# Aqui hay 9 niveles GPU fijos: F0 = 1.0 (maximo) ... F8 = 0.0 (minimo).
# NO cruzar estos IDs con los de campanas previas (alli F4 era el minimo).
