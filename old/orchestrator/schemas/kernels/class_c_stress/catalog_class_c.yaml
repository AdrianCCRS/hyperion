  # Calibración: reusa los mismos binarios de siempre (stream_c/ert_probe
  # no dependen de la clase NPB) -- se copian aquí porque calibration_path
  # apunta a este catálogo separado, que necesita sus propias entradas de
  # calibración para que calibration.py las resuelva.
  - id: stream_official
    suite: STREAM
    role: calibration
    exec_path: bin/stream_c
    reports_bandwidth_stdout: true
    bandwidth_stdout_pattern: "Triad:\\s+([0-9.]+)"
    bandwidth_stdout_unit_multiplier: 1000000
    success_check: {type: stdout_regex, pattern: "Solution Validates"}
    binary_checksum:
      # ARC-125: recompilado con -march=native, ver catalog.yaml principal.
      pacca-a100: "sha256:aa85c916a9e39063c927d978b74c10cc30287521a672bc6c600ea04b9567b4fc"
    estimated_memory_bytes: 1536000000

  - id: ert_probe
    suite: ERT
    role: calibration
    exec_path: bin/ert_probe
    reports_flops_stdout: true
    flops_stdout_pattern: "GFLOPs/sec:\\s+([0-9.]+)"
    flops_stdout_unit_multiplier: 1000000000
    success_check: {type: exit_code}
    estimated_memory_bytes: 67108864
    binary_checksum:
      # ARC-125/126: recompilado con -march=native -mprefer-vector-width=512,
      # ver catalog.yaml principal. Checksum final, ambas flags.
      pacca-a100: "sha256:12b3310aaaf3f80e0fa18a54872c94621c5557f58c1f3f5b238a57df10cd200f"
