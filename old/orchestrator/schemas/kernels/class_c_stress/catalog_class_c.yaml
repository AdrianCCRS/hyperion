# Catálogo de solo-prueba (2026-08-06): NPB clase C, usado exclusivamente
# para estresar el pipeline con corridas más largas/pesadas que la clase B
# de producción (catalog.yaml) -- NO es el catálogo del dataset final, no
# reemplaza catalog.yaml. Mismos 6 kernels floating-point confirmados
# (npb_bt/npb_sp reemplazaron a npb_ep/npb_is, ARC-57) más npb_mg/npb_cg/
# npb_ft/npb_lu, compilados clase C en pacca (2026-08-06) y medidos con 6
# hilos pinneados a cores 0-5 (mismo esquema que la campaña real):
#   mg.C: 7.52s, 3494152 KB pico
#   cg.C: 23.61s, 914200 KB pico
#   sp.C: 70.40s, 743372 KB pico
#   ft.C: 17.98s, 5270064 KB pico
#   lu.C: 68.55s, 576368 KB pico
#   bt.C: 101.85s, 711680 KB pico
# expected_runtime_seconds declara el tiempo medido real (runner.py aplica
# su propio SAFETY_MARGIN=3.0x automáticamente, no hay que pre-multiplicar).
# estimated_memory_bytes con margen generoso sobre el pico medido.

kernels:
  - id: npb_mg_c
    suite: NPB-OMP
    role: dataset
    exec_path: bin/mg.C.x
    phase_label_hint: memory_bound
    size_variant: C
    expected_runtime_seconds: 8
    warmup_seconds: 0.5
    estimated_memory_bytes: 4294967296
    success_check: {type: stdout_regex, pattern: "Verification\\s*=\\s*SUCCESSFUL"}
    binary_checksum:
      pacca-a100: "sha256:e5cd4e5fbdd4ce4a43a42995b9394fc47a6cb699f8483574f3c58e448a0df03e"
    flops_rate_stdout_pattern: "Mop/s total\\s*=\\s*([0-9.]+)"
    runtime_seconds_stdout_pattern: "Time in seconds\\s*=\\s*([0-9.]+)"

  - id: npb_cg_c
    suite: NPB-OMP
    role: dataset
    exec_path: bin/cg.C.x
