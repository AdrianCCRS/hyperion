# Núcleo activo de la matriz GPU (Anexo F.2 del plan maestro), con los 6
# niveles completos y los márgenes de potencia FINALES (Anexo I, ARC-194) --
# ya no provisionales, derivados de una sonda de reposo de 60 s/nivel con
# el transitorio de asentamiento excluido y del exceso real medido en tres
# kernels de referencia en los 6 niveles.
#
# PRECEDENTE. El pre-vuelo de 3 niveles (job 6457,
# campaign_pacca_gpu_uncore_disabled_preflight.yaml) ya validó de punta a
# punta el bypass ARC-191 (uncore.enabled=false con MAN-07 satisfecho por
# calibración de CPU) y el criterio de potencia ARC-185/189: 48/48
# corridas con margen declarado aceptadas, 24/24 sin margen (gpuREF)
# rechazadas fail-closed, exactamente como se diseñó. Este manifiesto no
# prueba un mecanismo nuevo -- extiende la cobertura de niveles del mismo
# mecanismo ya probado, con márgenes ya no provisionales.
#
# KERNELS. Los 4 con actividad real confirmada (auditoría fresca, ARC-188):
# rodinia_gaussian, gpu_dgemm_n4096, rodinia_heartwall, rodinia_lavamd.
# dwt2d sigue fuera (Anexo G.5, sin resolver); lud/backprop/myocyte
# excluidos o condicionales (Anexo F.2).
#
# COSTO. 4 kernels x 2 niveles CPU x 6 niveles GPU x 3 rep = 144 corridas.
# Coincide con la fila "Núcleo activo" de la tabla de Anexo F.2.

campaign_id: pacca_gpu_nucleo_activo_20260823
environment_tier: hpc_sc3
seed: 20260806

output_dir: /home/latorresn/hyperion-results/campaigns/pacca_gpu_nucleo_activo_20260823
overwrite: true

catalog_path: ../kernels/catalog.yaml

calibration:
  - kernel_ref: stream_official
  - kernel_ref: ert_probe

kernels:
  - kernel_ref: rodinia_gaussian
  - kernel_ref: gpu_dgemm_n4096
  - kernel_ref: rodinia_heartwall
  - kernel_ref: rodinia_lavamd

frequency_levels:
  - {id: REF, mode: native_governor}
  - {id: F4, mode: fixed, fraction: 0.0}

gpu_frequency_levels:
  - {id: REF, mode: native_governor}
  - {id: F0, mode: fixed, fraction: 1.0}
  - {id: F1, mode: fixed, fraction: 0.75}
  - {id: F2, mode: fixed, fraction: 0.5}
  - {id: F3, mode: fixed, fraction: 0.25}
  - {id: F4, mode: fixed, fraction: 0.0}

repetitions_per_combination: 3
target_windows_per_repetition: 5
interval_ns: 1000000
gpu_interval_ns: 5000000

running_ratio_min: 0.90

frequency_validation:
  require_per_window: true
  tolerance_fraction: 0.05
  grace_seconds: 0.05

cores:
  delegated_cpus: [0, 1, 2, 3, 4, 5]
  collector_cpu: 6
  consumer_cpu: 7
  numa_node_pin: 0

smt_policy: one_thread_per_physical_core

cgroup_path: null

perf_enabled: true

frequency_settle:
  enabled: true
  timeout_seconds: 30.0
  tolerance_fraction: 0.05
  poll_interval_seconds: 0.5

rapl:
  enabled: true

# ARC-191: en falso a propósito -- ningún kernel de CPU en `kernels:`
# (dataset), así que E12 no lo exige aunque MAN-07 obligue a declarar
# stream_official/ert_probe en `calibration:`.
uncore:
  enabled: false

turbo:
  require_disabled: true

temperature:
  require_package_sensor: true
  minimum_c: 0
  maximum_c: 90

gpu:
  enabled: true
  calibration:
    - gpu_stream_bw
    - gpu_ert_probe_fp32
    - gpu_ert_probe_fp64
  # ARC-194 (Anexo I): márgenes FINALES, los 6 niveles, ya no provisionales.
  idle_power_mw_by_level:
    REF: 33654.0
    F0: 53621.8
    F1: 39856.8
    F2: 36084.9
    F3: 34441.0
    F4: 33677.6
  active_power_margin_mw:
    REF: 800
    F0: 4000
    F1: 2000
    F2: 1200
    F3: 900
    F4: 800

timeouts_seconds:
  ready: 15
  run: 180
  shutdown: 15

hardware_datasheet:
  bw_pico_bytes_per_s: 59500000000
  p_pico_flops_per_s: 480000000000

