# Smoke REF-only de la campana "big" CPU (2026-08-30). Corre los 9 kernel_ref
# nuevos (GEMM/Cholesky/FFT N=8192/12288/16384) a REF (governor nativo, sin
# DVFS fijo) antes de comprometer una sesion larga con
# campaign_pacca_dual_cpu_big.yaml. repetitions_per_combination=3 (MAN-02:
# el orquestador exige minimo 3, no hay forma de bajarlo a 1) -- aun asi
# 9 kernels x 1 nivel x 3 rep = 27 corridas, suma(expected_runtime_seconds)
# x 3 ~= 4100 s ~= 68 min en el peor caso (REF sin slowdown DVFS), cabe en
# una fraccion pequena de una sesion. Objetivo: confirmar tiempos reales
# (expected_runtime_seconds del catalogo son calibracion de 1 iteracion,
# ver commit 01a053d) y memoria pico (FFT N=16384 estima ~11.2GB) antes de
# fijar --time/--campaign-timeout-seconds del sbatch grande.
#
# campaign_id / output_dir propios -- no debe mezclarse con la campana big
# real ni disparar CampaignProtocolMismatchError contra ella.
#
# Lanzar a mano (no incluido en el sbatch grande, ver "COMO RELANZAR" en
# run_campaign_pacca_dual_cpu_big.sbatch):
#   python3 -m orchestrator.cli run-campaign \
#     --manifest orchestrator/schemas/campaigns/campaign_pacca_dual_cpu_big_smoke.yaml \
#     --node-id pacca-a100 --hostname "$(hostname)" \
#     --reference-kernel-ref dual_gemm_cpu_N512 \
#     --campaign-timeout-seconds 5400

campaign_id: pacca_dual_cpu_big_smoke_20260830
environment_tier: hpc_sc3
seed: 20260830

output_dir: /home/latorresn/hyperion-results/campaigns/pacca_dual_cpu_big_smoke_20260830
overwrite: true

catalog_path: ../kernels/catalog.yaml

calibration:
  - kernel_ref: stream_official
  - kernel_ref: ert_probe

kernels:
  - kernel_ref: dual_gemm_cpu_N8192
  - kernel_ref: dual_gemm_cpu_N12288
  - kernel_ref: dual_gemm_cpu_N16384
  - kernel_ref: dual_fft_cpu_N8192
  - kernel_ref: dual_fft_cpu_N12288
  - kernel_ref: dual_fft_cpu_N16384
  - kernel_ref: dual_cholesky_cpu_N8192
  - kernel_ref: dual_cholesky_cpu_N12288
  - kernel_ref: dual_cholesky_cpu_N16384

frequency_levels:
  - {id: REF, mode: native_governor}

repetitions_per_combination: 3  # MAN-02: el orquestador exige minimo 3
baseline_repetition_indices: [1]
target_windows_per_repetition: 5
interval_ns: 1000000  # 1 ms
gpu_interval_ns: 5000000  # 5 ms

running_ratio_min: 0.90

frequency_validation:
  require_per_window: true
  tolerance_fraction: 0.05
  grace_seconds: 0.05

cores:
  delegated_cpus: [0, 1, 2, 3, 4, 5]
  collector_cpu: 6
  consumer_cpu: 7
  numa_node_pin: 0

smt_policy: one_thread_per_physical_core

cgroup_path: null

perf_enabled: true

frequency_settle:
  enabled: true
  timeout_seconds: 30.0
  tolerance_fraction: 0.05
  poll_interval_seconds: 0.5

rapl:
  enabled: true

uncore:
  enabled: true

turbo:
  require_disabled: true

temperature:
  require_package_sensor: true
  minimum_c: 0
  maximum_c: 90

gpu:
  enabled: true

timeouts_seconds:
  ready: 15
  run: 180
  shutdown: 15

hardware_datasheet:
  bw_pico_bytes_per_s: 59500000000
  p_pico_flops_per_s: 509083000000

projected_campaign_bytes: 20000000
remaining_core_hours: 1000.0
projected_core_hours: 1.0
