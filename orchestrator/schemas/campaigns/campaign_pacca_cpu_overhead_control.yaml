# ARC-155: terreno de medicion para decidir si el eje de CPU debe fijarse a
# un nivel bajo (p. ej. minimo) durante combinaciones de kernels GPU, ahora
# que el shim de blocking-sync esta confirmado activo (ARC-153/154) y el
# host realmente duerme en vez de spinnear mientras el GPU trabaja.
#
# Objetivo: aislar si la frecuencia de CPU afecta el overhead de lanzamiento
# de kernel medible en el tiempo total de una corrida GPU real -- no la
# frecuencia de GPU en si, que se mantiene fija (gpu_frequency_levels con un
# unico nivel REF) mientras se barre CPU (frequency_levels REF/F0/F4).
#
# rodinia_gaussian elegido a proposito: ~8190 lanzamientos de kernel CUDA en
# una sola corrida (n-1 pasos de eliminacion Gaussiana x 2 kernels cada
# uno, ARC-110) -- el kernel del catalogo con mas overhead de lanzamiento
# acumulado por corrida, el caso mas sensible si el efecto existe.
#
# NO forma parte del dataset final -- output_dir separado bajo diagnostics/,
# nunca campaigns/. Sin frequency_validation.require_per_window: a
# diferencia de campaign_pacca_dvfs_smoke.yaml, este manifiesto no valida la
# traza de frecuencia por ventana (CAL-07 esta bloqueando la campana CPU
# final por una causa sin resolver, ARC-150/152, no relacionada con este
# control) -- aqui el interes es el tiempo total de corrida, no la
# estabilidad de scaling_cur_freq por ventana. Mismo criterio ya usado por
# campaign_pacca_gpu_smoke.yaml (tampoco declara frequency_validation).
campaign_id: pacca_cpu_overhead_control_20260819
environment_tier: hpc_sc3
seed: 20260806

output_dir: /home/latorresn/hyperion-results/diagnostics/pacca_cpu_overhead_control_20260819
overwrite: true

catalog_path: ../kernels/catalog.yaml

calibration:
  - kernel_ref: stream_official
  - kernel_ref: ert_probe

kernels:
  - kernel_ref: rodinia_gaussian

# Eje de CPU: los dos extremos (F0 techo, F4 piso) mas REF como referencia
# de gobernador nativo -- si el overhead de lanzamiento depende de la
# frecuencia de CPU, la diferencia deberia ser maxima entre F0 y F4.
frequency_levels:
  - {id: REF, mode: native_governor}
  - {id: F0, mode: fixed, fraction: 1.0}
  - {id: F4, mode: fixed, fraction: 0.0}

# Eje de GPU: UN SOLO nivel (gobernador nativo) -- se mantiene constante
# adrede en las 3 combinaciones para que cualquier diferencia observada en
# el tiempo total de corrida sea atribuible al eje de CPU, no a que GPU
# tambien cambio de estado (campaign.py:build_matrix hace el producto
# cartesiano completo frequency_levels x gpu_frequency_levels cuando este
# campo esta declarado y el kernel es device=="gpu", ARC-129).
gpu_frequency_levels:
  - {id: GREF, mode: native_governor}

repetitions_per_combination: 3
target_windows_per_repetition: 50
interval_ns: 1000000  # 1 ms
gpu_interval_ns: 5000000  # 5 ms

running_ratio_min: 0.90

turbo:
  require_disabled: true

temperature:
  require_package_sensor: true
  minimum_c: 0
  maximum_c: 90

projected_campaign_bytes: 3221225472
remaining_core_hours: 100000
projected_core_hours: 30

cores:
  delegated_cpus: [0, 1, 2, 3, 4, 5]
  collector_cpu: 6
  consumer_cpu: 7
  numa_node_pin: 0

smt_policy: one_thread_per_physical_core

cgroup_path: null

perf_enabled: true

rapl:
  enabled: true

uncore:
  enabled: true

gpu:
  enabled: false
  calibration:
    - gpu_stream_bw
    - gpu_ert_probe_fp32
    - gpu_ert_probe_fp64

timeouts_seconds:
  ready: 15
  run: 60
  shutdown: 15

hardware_datasheet:
  bw_pico_bytes_per_s: 59500000000
  p_pico_flops_per_s: 480000000000
