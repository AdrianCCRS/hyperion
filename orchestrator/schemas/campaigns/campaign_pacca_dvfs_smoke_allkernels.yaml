# ARC-133 (2026-08-12): segunda prueba de humo pre-vuelo, pedida
# explícitamente por el usuario ("Asugurate al 100% que todo este probado")
# tras confirmar 18/18 en campaign_pacca_dvfs_smoke.yaml -- esa prueba solo
# cubrió npb_mg (1 de los 7 kernels reales de campaign_pacca_dvfs.yaml).
# Este manifiesto corre los 7 kernels reales una vez cada uno a REF
# (repetitions_per_combination=3, el mínimo de MAN-02), sin barrer
# frecuencia -- eso ya quedó probado con npb_mg en ARC-131/132 (F0-F4
# completo), y la actuación de frecuencia no depende de CUÁL kernel corre,
# solo de freqctl.py/apply_frequency, ya verificado. Objetivo específico de
# esta prueba: (1) los 5 binarios NPB restantes (bt/cg/sp/ft/lu),
# recompilados en ARC-126 pero nunca ejecutados con telemetría real en esta
# sesión; (2) dgemm_n2048, cuyo fix de LD_LIBRARY_PATH para OpenBLAS
# (ARC-127) nunca se probó de verdad -- si falla, debe fallar aquí, en
# minutos, no a mitad de la campaña real de 3h.
#
# Duración estimada: bt~30s + mg~4s + cg~26s + sp~20s + ft~14s + lu~40s +
# dgemm_n2048~5s = ~139s x 3 repeticiones ~= 7 min + calibración + overhead.
#
# Resto de la configuración idéntica a campaign_pacca_dvfs.yaml/
# campaign_pacca_dvfs_smoke.yaml, ya validada en hardware real.

campaign_id: pacca_dvfs_smoke_allkernels_20260812
environment_tier: hpc_sc3
seed: 20260806

output_dir: /home/latorresn/hyperion-results/campaigns/pacca_dvfs_smoke_allkernels_20260812
