# Tamizaje de alpha en GPU -- candidatos limitados por memoria (Anexo K.7).
#
# PROPOSITO. El Anexo K estableció que el catálogo GPU actual no tiene
# margen de DVFS: 3 de 4 kernels tienen el óptimo en el reloj máximo, y
# alpha predice ese resultado 4/4 con el umbral heredado del eje CPU
# (alpha < 0.226 => el DVFS paga). El mecanismo quedó identificado:
# `nvidia-smi -lgc` escala SOLO el reloj de SM, el de memoria queda
# intacto, así que el margen vive en los kernels limitados por ancho de
# banda de DRAM. Verificado con `gpu_stream_bw`: alpha=0.071.
#
# Esta campaña NO produce dataset de entrenamiento. Su única salida es
# alpha por kernel, para decidir cuáles sobreviven a una campaña completa.
#
# CANDIDATOS, por intensidad operacional declarada (más baja = más
# limitado por memoria = mejor candidato):
#   rodinia_myocyte   OI = 0.06   <- el más memory-bound del catálogo
#   rodinia_backprop  OI = 0.45
#   rodinia_dwt2d     OI = 2.17   <- el excluido en G.5, ahora prometedor
#
# CONTROL POSITIVO GRATIS. `gpu_stream_bw` no va en `kernels:` sino que
# ya corre como calibración GPU en los 6 niveles automáticamente. Eso da
# el control positivo en las MISMAS condiciones sin gastar una corrida ni
# tener que declararle una OI estática arbitraria (CAT-10) a un kernel
# cuya mezcla copy/scale/add/triad no tiene una OI única defendible.
# Se lee después con `classifier/analysis/gpu_alpha_calibration_kernels.py`.
#
# TRAMPA CONOCIDA -- `rodinia_myocyte` escribe ~290 MB en `run/myocyte/
# output.txt`. Un costo de I/O FIJO no escala con el reloj de SM, así que
# infla la fracción serial (1-alpha) y produce un alpha BAJO ESPURIO,
# indistinguible por el ajuste de un kernel genuinamente memory-bound.
# Si myocyte sale con alpha bajo, ese resultado NO se puede aceptar sin
# antes descontar el tiempo de escritura. Anotado en K.7 como post-chequeo
# obligatorio, no como resultado.
#
# RECHAZOS NO IMPORTAN. Verificado en vivo sobre las corridas rechazadas
# del job 6457: una corrida con `accepted: false` (factor I10) conserva
# `summary.txt` con `telemetry_elapsed_ns_mean` válido. Como alpha se
# ajusta solo sobre tiempos, el tamizaje es inmune al criterio de
# actividad -- relevante para `dwt2d`, cuyo exceso de potencia en F4 cae
# a ~1 W (G.5) y muy probablemente será rechazado ahí.
#
# CPU=REF UNICAMENTE. K.5 mostró que CPU al mínimo cuesta energía en los
# 4 kernels medidos (hasta +215%), así que como política es la opción
# equivocada y no hay razón para tamizar en ese régimen. Además evita
# duplicar el costo de la campaña.
#
# COSTO. 3 kernels x 6 niveles GPU x 3 rep = 54 corridas.

campaign_id: pacca_gpu_alpha_screening_20260823
environment_tier: hpc_sc3
seed: 20260806

output_dir: /home/latorresn/hyperion-results/campaigns/pacca_gpu_alpha_screening_20260823
overwrite: true

catalog_path: ../kernels/catalog.yaml

calibration:
  - kernel_ref: stream_official
  - kernel_ref: ert_probe

kernels:
  - kernel_ref: rodinia_myocyte
  - kernel_ref: rodinia_backprop
  - kernel_ref: rodinia_dwt2d

frequency_levels:
  - {id: REF, mode: native_governor}

gpu_frequency_levels:
