  - {id: F0, mode: fixed, fraction: 1.0}
  - {id: F1, mode: fixed, fraction: 0.75}
  - {id: F2, mode: fixed, fraction: 0.5}
  - {id: F3, mode: fixed, fraction: 0.25}
  - {id: F4, mode: fixed, fraction: 0.0}

repetitions_per_combination: 3
target_windows_per_repetition: 5
interval_ns: 1000000
gpu_interval_ns: 5000000

running_ratio_min: 0.90

frequency_validation:
  require_per_window: true
  tolerance_fraction: 0.05
  grace_seconds: 0.05

cores:
  delegated_cpus: [0, 1, 2, 3, 4, 5]
  collector_cpu: 6
  consumer_cpu: 7
  numa_node_pin: 0

smt_policy: one_thread_per_physical_core

cgroup_path: null

perf_enabled: true

frequency_settle:
  enabled: true
  timeout_seconds: 30.0
  tolerance_fraction: 0.05
  poll_interval_seconds: 0.5

rapl:
  enabled: true

# ARC-191: ningún kernel de CPU en `kernels:`, así que E12 no exige uncore
# aunque MAN-07 obligue a declarar stream_official/ert_probe en
# `calibration:`. Necesario mientras CAP_PERFMON siga roto (ARC-184).
uncore:
  enabled: false

turbo:
  require_disabled: true

temperature:
  require_package_sensor: true
  minimum_c: 0
  maximum_c: 90

gpu:
  enabled: true
  calibration:
    - gpu_stream_bw
    - gpu_ert_probe_fp32
    - gpu_ert_probe_fp64
  # Márgenes finales de ARC-194 / Anexo I, sin cambios. Los rechazos que
  # provoquen no afectan el tamizaje (ver nota arriba).
  idle_power_mw_by_level:
    REF: 33654.0
    F0: 53621.8
    F1: 39856.8
    F2: 36084.9
    F3: 34441.0
    F4: 33677.6
  active_power_margin_mw:
    REF: 800
    F0: 4000
    F1: 2000
    F2: 1200
    F3: 900
    F4: 800

# Subido de 180 s: en F4 (210 MHz) el reloj está recortado 6.7x y dwt2d
# ya tardaba 25.7 s ahí con 16384x16384. myocyte es de duración
# desconocida y además escribe 290 MB.
