# Pre-vuelo del contrato cold/warm: extremos de tamaño de las seis
# operaciones GPU, a reloj nativo/máximo/mínimo. SpMV máximo prueba la
# transferencia del CSR completo y Cholesky máximo el generador SPD O(N^2).
campaign_id: pacca_dual_coldwarm_gpu_smoke_20260828
environment_tier: hpc_sc3
seed: 20260828
output_dir: /home/latorresn/hyperion-results/campaigns/pacca_dual_coldwarm_gpu_smoke_20260828
overwrite: true
catalog_path: ../kernels/catalog.yaml

calibration:
  - kernel_ref: stream_official
  - kernel_ref: ert_probe

kernels:
  - {kernel_ref: dual_gemm_gpu_N64}
  - {kernel_ref: dual_gemm_gpu_N4096}
  - {kernel_ref: dual_fft_gpu_N64}
  - {kernel_ref: dual_fft_gpu_N4096}
  - {kernel_ref: dual_axpy_gpu_N10000}
  - {kernel_ref: dual_axpy_gpu_N31622777}
  - {kernel_ref: dual_stencil_gpu_N64}
  - {kernel_ref: dual_stencil_gpu_N4096}
  - {kernel_ref: dual_cholesky_gpu_N64}
  - {kernel_ref: dual_cholesky_gpu_N4096}
  - {kernel_ref: dual_spmv_gpu_N10000}
  - {kernel_ref: dual_spmv_gpu_N31622777}

frequency_levels:
  - {id: REF, mode: native_governor}
gpu_frequency_levels:
  - {id: REF, mode: native_governor}
  - {id: F0, mode: fixed, fraction: 1.0}
  - {id: F6, mode: fixed, fraction: 0.0}

repetitions_per_combination: 3
baseline_repetition_indices: [1]
target_windows_per_repetition: 5
interval_ns: 1000000
gpu_interval_ns: 5000000
running_ratio_min: 0.90
frequency_validation:
  require_per_window: true
  tolerance_fraction: 0.05
  grace_seconds: 0.05
cores:
  delegated_cpus: [0, 1, 2, 3, 4, 5]
  collector_cpu: 6
  consumer_cpu: 7
  numa_node_pin: 0
smt_policy: one_thread_per_physical_core
cgroup_path: null
perf_enabled: true
frequency_settle:
  enabled: true
  timeout_seconds: 30.0
  tolerance_fraction: 0.05
  poll_interval_seconds: 0.5
rapl: {enabled: true}
uncore: {enabled: true}
turbo: {require_disabled: true}
temperature:
  require_package_sensor: true
  minimum_c: 0
  maximum_c: 90
gpu:
  enabled: true
  calibration:
    - gpu_stream_bw
    - gpu_ert_probe_fp32
    - gpu_ert_probe_fp64
  # Líneas/márgenes medidos en pacca (ARC-194). F6 de la rejilla dual es
  # el mismo reloj mínimo de 210 MHz que se llamaba F4 en esa campaña.
  # Este criterio reemplaza el piso legado de utilization=5 %, que el
  # smoke 6713 demostró incapaz de ver GEMM/Cholesky N=64 aunque su salida,
  # reloj, potencia y región warm fueran válidos.
  idle_power_mw_by_level:
    REF: 33654.0
    F0: 53621.8
    F6: 33677.6
  active_power_margin_mw:
    REF: 800.0
    F0: 4000.0
    F6: 800.0
timeouts_seconds: {ready: 15, run: 180, shutdown: 15}
hardware_datasheet:
  bw_pico_bytes_per_s: 59500000000
  p_pico_flops_per_s: 509083000000
projected_campaign_bytes: 200000000
remaining_core_hours: 1000.0
projected_core_hours: 4.0
