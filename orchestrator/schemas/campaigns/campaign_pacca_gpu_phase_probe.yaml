# Prueba V4 (docs/general/Estrategia_GPU_Fase2.md §10): ¿existe alternancia
# de fases intra-corrida EXPLOTABLE en GPU?
#
# EL HUECO QUE CIERRA. La Estrategia GPU §3 sostiene que la granularidad
# correcta del modelo es la carga/kernel, no la ventana. El argumento se
# apoya en que el óptimo de corrida completa es constante por kernel
# (Anexo K). Pero de ahí NO se sigue que no exista alternancia dentro de la
# corrida: es precisamente lo que la instrumentación de GPU no puede
# observar (CAT-10 -- la intensidad operacional es estática por kernel,
# medida offline con ncu, porque los contadores de tráfico DRAM viven en la
# Profiling API de CUPTI, que exige replay del kernel). Afirmar la ausencia
# de un fenómeno que no se puede medir es circular.
#
# ESTA CAMPAÑA ROMPE LA CIRCULARIDAD. `gpu_phasic` alterna dos regímenes
# extremos POR CONSTRUCCIÓN (compute_phase = FMA sin tráfico de memoria;
# memory_phase = persecución de punteros sin FLOPs) y emite marcas de
# verdad en stdout (`PHASE`, `T0_MONOTONIC_NS`). Eso permite cruzar OFFLINE
# la fase real contra `gpu_power_mw`/`gpu_sm_clock_mhz` por ventana, sin
# depender del etiquetado automático que CAT-10 rompe.
#
# CRITERIO DE LECTURA (declarado antes de ver el dato, a propósito):
#   - Si las dos fases son distinguibles en potencia Y su nivel óptimo
#     difiere -> hay alternancia explotable; la granularidad por ventana
#     tiene sustento y hay que revisar §3.
#   - Si NO son distinguibles, o lo son pero el óptimo no difiere ->
#     la granularidad por carga queda confirmada CON EVIDENCIA POSITIVA,
#     no por ausencia de medición. Este es el resultado que la Estrategia
#     GPU espera, pero se mide en vez de asumirse.
#
# LIMITACIÓN CONOCIDA, no un descuido: `phase_label_train` saldrá CONSTANTE
# en todas las filas (CAT-10, ver el comentario de gpu_phasic_p010 en el
# catálogo). El dataset de esta campaña NO sirve para entrenar el
# clasificador directamente; sirve para el cruce offline descrito arriba.
#
# `gpu_phasic_p010` (período 10 ms) es sospechoso de aportar poco: el
# muestreo de NVML es de ~100 ms (gpu_interval_ns=5 ms aquí, pero el sensor
# físico refresca mucho más lento), así que un período de 10 ms queda por
# debajo de la resolución del instrumento. Se incluye igual para MEDIR ese
# límite en vez de suponerlo -- es el control negativo de la prueba.
#
# COSTO. 3 kernels x 6 niveles GPU x 1 nivel CPU x 3 rep = 54 corridas.

campaign_id: pacca_gpu_phase_probe_20260824
environment_tier: hpc_sc3
