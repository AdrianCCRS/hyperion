    F0: 53621.8
    F1: 39856.8
    F2: 36084.9
    F3: 34441.0
    F4: 33677.6
  active_power_margin_mw:
    REF: 800
    F0: 4000
    F1: 2000
    F2: 1200
    F3: 900
    F4: 800

