# Barrido de tamaño de rodinia_dwt2d para diversidad de carga (Anexo N).
#
# PROPOSITO. El dataset de entrenamiento del modelo GPU tenía 7 kernels
# -- muy poco para entrenar y evaluar nada con leave-one-kernel-out
# defendible (con 7, entrenás sobre 6). Esta campaña agrega 4 puntos de
# carga nuevos del MISMO kernel (mismo binario, mismo checksum, datos ya
# presentes en disco, verificados íntegros) para tener comportamiento de
# memoria distinto sin el riesgo de compilar/validar binarios nuevos.
#
# A diferencia de campaign_pacca_gpu_fine_grid_dataset.yaml, esta usa los
# 6 niveles GPU ESTANDAR (Anexo I) con márgenes MEDIDOS, no interpolados
# -- cero riesgo de rechazo masivo por margen mal puesto.
#
# COSTO. 5 tamaños (192/2048/4096/8192/16384) x 6 niveles GPU x 1 CPU x
# 3 rep = 90 corridas. MAN-02 exige un mínimo de 3 repeticiones por
# combinación -- no se puede bajar a 2 aunque el propósito aquí sea
# diversidad de carga más que precisión estadística fina.

campaign_id: pacca_gpu_dwt2d_size_sweep_20260823
environment_tier: hpc_sc3
seed: 20260806

output_dir: /home/latorresn/hyperion-results/campaigns/pacca_gpu_dwt2d_size_sweep_20260823
overwrite: true

catalog_path: ../kernels/catalog.yaml

calibration:
  - kernel_ref: stream_official
  - kernel_ref: ert_probe

kernels:
  - kernel_ref: rodinia_dwt2d_s192
  - kernel_ref: rodinia_dwt2d_s2048
  - kernel_ref: rodinia_dwt2d_s4096
  - kernel_ref: rodinia_dwt2d_s8192
  - kernel_ref: rodinia_dwt2d

frequency_levels:
  - {id: REF, mode: native_governor}

gpu_frequency_levels:
  - {id: REF, mode: native_governor}
  - {id: F0, mode: fixed, fraction: 1.0}
  - {id: F1, mode: fixed, fraction: 0.75}
  - {id: F2, mode: fixed, fraction: 0.5}
  - {id: F3, mode: fixed, fraction: 0.25}
  - {id: F4, mode: fixed, fraction: 0.0}

repetitions_per_combination: 3
target_windows_per_repetition: 5
interval_ns: 1000000
gpu_interval_ns: 5000000

running_ratio_min: 0.90

frequency_validation:
  require_per_window: true
  tolerance_fraction: 0.05
  grace_seconds: 0.05

cores:
  delegated_cpus: [0, 1, 2, 3, 4, 5]
  collector_cpu: 6
  consumer_cpu: 7
  numa_node_pin: 0

smt_policy: one_thread_per_physical_core

cgroup_path: null

perf_enabled: true

frequency_settle:
  enabled: true
  timeout_seconds: 30.0
  tolerance_fraction: 0.05
  poll_interval_seconds: 0.5

rapl:
  enabled: true

# ARC-191: ver campaign_pacca_gpu_fine_grid_dataset.yaml.
uncore:
  enabled: false

turbo:
  require_disabled: true

temperature:
  require_package_sensor: true
  minimum_c: 0
  maximum_c: 90

gpu:
  enabled: true
  calibration:
    - gpu_stream_bw
    - gpu_ert_probe_fp32
    - gpu_ert_probe_fp64
  # Márgenes finales de ARC-194 / Anexo I, sin cambios -- MEDIDOS.
  idle_power_mw_by_level:
    REF: 33654.0
    F0: 53621.8
    F1: 39856.8
    F2: 36084.9
    F3: 34441.0
    F4: 33677.6
  active_power_margin_mw:
    REF: 800
    F0: 4000
    F1: 2000
    F2: 1200
    F3: 900
    F4: 800

# 192x192 dura ~2s; 16384x16384 dura ~25s en F4 (medido, Anexo K.7). 300s
# cubre con margen amplio los 5 tamaños en cualquier nivel.
timeouts_seconds:
  ready: 15
  run: 300
  shutdown: 15

hardware_datasheet:
  bw_pico_bytes_per_s: 59500000000
  p_pico_flops_per_s: 480000000000

projected_campaign_bytes: 200000000
remaining_core_hours: 1000.0
projected_core_hours: 2.0
