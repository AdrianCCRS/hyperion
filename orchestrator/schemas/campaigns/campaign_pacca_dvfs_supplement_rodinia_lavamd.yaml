# ARC-169: campaña suplementaria dirigida SOLO a rodinia_lavamd_omp -- la
# campaña principal (pacca_cpu_final_attempt03_20260820, ARC-168) quedó con
# 0/10 aceptadas en F0/F1/F2/F3 para este kernel. Investigado: dos efectos
# distintos, ambos ya diagnosticados en otros kernels de esta sesión, pero
# combinados aquí --
#   (1) un transitorio de arranque que se extiende hasta ~960ms (mucho más
#       que grace_seconds=0.05, calibrado con ert_probe -- un kernel de
#       ~83ms de duración total, nada comparable a los ~9.6s de LavaMD),
#   (2) dilución por inactividad en la ÚNICA unión final de su región
#       paralela (mismo mecanismo que ARC-167 documentó para
#       stream_official, pero concentrado al final en vez de disperso
#       entre fases -- LavaMD no tiene las barreras internas repetidas de
#       STREAM/CG).
# grace_seconds=1.2 y tail_grace_seconds=1.2 (ARC-169, nuevo campo) dan
# ~25% de margen sobre el peor caso medido (~960ms) en ambos extremos, sin
# comprometer la validación del tramo intermedio de la corrida (8+ de los
# ~9.6s totales).
#
# Resto de la configuración idéntica a campaign_pacca_dvfs.yaml.

campaign_id: pacca_cpu_supplement_rodinia_lavamd_20260820
environment_tier: hpc_sc3
