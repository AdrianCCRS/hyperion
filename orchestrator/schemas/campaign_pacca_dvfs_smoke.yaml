# Smoke test de escritura real de frecuencia en paccaA100 (ARC-104,
# 2026-08-10), tras la llegada del permiso P1 (scaling_min_freq/
# scaling_max_freq, ver correo del admin del cluster). Objetivo: confirmar
# que apply_frequency() realmente pinea el hardware y que RUN-09 no
# dispara -- no producir datos para el dataset final. Reduce
# campaign_pacca_dvfs.yaml a 3 kernels: npb_mg como extremo memory-bound y
# los dos candidatos compute-bound recién caracterizados, por 10 niveles
# (REF + nueve puntos fijos cada 12,5 %) x 3 repeticiones = 90 corridas +
# calibración. Este reconocimiento permite decidir con datos si los cinco
# niveles F0--F4 capturan la curva. GPU sigue deshabilitada (gpu.enabled=false) -- este smoke
# test valida solo el eje CPU; el eje GPU (P4, nvidia-smi -lgc/-rgc con
# sudo) se valida por separado. repetitions_per_combination=3 (no 1) es el
# mínimo que exige MAN-02 y aquí solo sirve para el pre-vuelo reducido; la
# campaña final usa 10.
#
# Resto de la configuración (cores, RAPL, catálogo, smt_policy,
# hardware_datasheet) idéntica a campaign_pacca_dvfs.yaml/
# campaign_pacca_ref.yaml, ya validada en hardware real.

# ARC-130 (2026-08-12): reactivado como smoke test PRE-VUELO de la campaña
# completa (campaign_pacca_dvfs.yaml, ARC-127/128) -- verifica de punta a
# punta (preflight, uncore, checksums, calibración, escritura de
# frecuencia, postprocess, validate_windows) en ~5-10 min reales antes de
# comprometer las 3h de la campaña completa. Mismos 2 fixes que ARC-127 ya
# aplicó ahí: uncore.enabled agregado (E12 lo exige, todo kernel es CPU) y
# hardware_datasheet.p_pico_flops_per_s actualizado (72 GFLOP/s era el
# valor con el bug de ert_probe ya corregido en ARC-125/126, D03 lo
# hubiera rechazado). campaign_id/output_dir con fecha nueva para no
# reanudar contra el smoke test viejo de ARC-104/108 (protocolo distinto,
# CAM-09 lo rechazaría de todas formas, pero mejor no reusar el directorio).
campaign_id: pacca_cpu_final_preflight_20260814
environment_tier: hpc_sc3
seed: 20260806

output_dir: /home/latorresn/hyperion-results/campaigns/pacca_cpu_final_preflight_20260814
overwrite: true

catalog_path: kernels/catalog.yaml

calibration:
  - kernel_ref: stream_official
  - kernel_ref: ert_probe

kernels:
  - kernel_ref: npb_mg
  - kernel_ref: rodinia_lavamd_omp
  - kernel_ref: rajaperf_polybench_3mm_omp

frequency_levels:
  - {id: REF, mode: native_governor}
  - {id: F0, mode: fixed, fraction: 1.0}
  - {id: F0125, mode: fixed, fraction: 0.875}
  - {id: F1, mode: fixed, fraction: 0.75}
  - {id: F1375, mode: fixed, fraction: 0.625}
  - {id: F2, mode: fixed, fraction: 0.5}
  - {id: F2375, mode: fixed, fraction: 0.375}
  - {id: F3, mode: fixed, fraction: 0.25}
  - {id: F3125, mode: fixed, fraction: 0.125}
  - {id: F4, mode: fixed, fraction: 0.0}

repetitions_per_combination: 3
target_windows_per_repetition: 50
interval_ns: 1000000  # 1 ms

running_ratio_min: 0.90

frequency_validation:
  require_per_window: true
  tolerance_fraction: 0.05

turbo:
  require_disabled: true

temperature:
  require_package_sensor: true
  minimum_c: 0
  maximum_c: 90

# I09/OPS-01: la cuenta latorresn no tiene cuota de disco ni límite de
# horas-núcleo real que el usuario haya pedido rastrear (confirmado
# 2026-08-10, "uso ilimitado, no te preocupes por eso") -- estos valores
# solo satisfacen el chequeo de preflight, no representan un límite real.
# 3 GiB y 30 horas-núcleo cubren con margen las 90 combinaciones, sus
# baselines y calibraciones, a partir del uso real de las campañas REF.
projected_campaign_bytes: 3221225472
remaining_core_hours: 100000
projected_core_hours: 30

cores:
  delegated_cpus: [0, 1, 2, 3, 4, 5]
  collector_cpu: 6
  consumer_cpu: 7
  numa_node_pin: 0

smt_policy: one_thread_per_physical_core

cgroup_path: null

perf_enabled: true

rapl:
  enabled: true

uncore:
  enabled: true

gpu:
  enabled: false

timeouts_seconds:
  ready: 15
  run: 60
  shutdown: 15

hardware_datasheet:
  bw_pico_bytes_per_s: 59500000000
  p_pico_flops_per_s: 480000000000
