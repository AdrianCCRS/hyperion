# Catálogo con ground truth real (F3.1/F3.2), compilado y ejecutado en felix
# el 2026-07-31 (ver docs/orchestator/agents/Registro_Cambios_Fuera_Plan_Original.md,
# ARC-31/ARC-32 para las decisiones de diseño y evidencia completa).
#
# Convención de exec_path: rutas relativas a la raíz de binarios compilados
# (~/hyperion-kernels/bin en felix hoy). El orquestador debe lanzarse con esa
# carpeta como cwd (`cd ~/hyperion-kernels && python -m orchestrator...`).
# Se mantiene relativo (no absoluto a $HOME de un usuario) para que el mismo
# catálogo sea reproducible en un clúster distinto sin editar cada exec_path.
#
# Procedencia NPB (CAT-01, provenance): NPB3.4.4.tar.gz descargado de
# https://www.nas.nasa.gov/assets/npb/NPB3.4.4.tar.gz,
# sha256:1ae219398e02a0a79ad51b7460fcffbf7b5df83a69d5d3d3a9dc2d8acf523549.
# Compilado en felix con el módulo gnu14 (gfortran/gcc 14.2.0), flags por
# defecto del suite (config/make.def.template sin modificar: FFLAGS/CFLAGS =
# -O3 -fopenmp, sin -march=native, MLT-07). NPB3.4-OMP, clase B para dataset
# (clase S se usa solo como smoke test local, no está en este catálogo).
#
# Procedencia STREAM (CAT-01): stream.c oficial de John D. McCalpin,
# https://www.cs.virginia.edu/stream/FTP/Code/stream.c,
# sha256:a52bae5e175bea3f7832112af9c085adab47117f7d2ce219165379849231692b,
# vendorizado sin modificar en kernels/stream/stream.c. Compilado con
# -O3 -fopenmp -DSTREAM_ARRAY_SIZE=64000000 (~512 MB/arreglo, muy por
# encima de los 24 MB de L3 por socket de felix -- ver ARC-32).
#
# Procedencia ERT (CAT-01): kernels/ert/ert_probe.c, driver propio que
# reimplementa la aritmética de ERT (kernel1.c, ERT_FLOP=16) -- decisión
# documentada en ARC-31, amparada por CAL-03 (ERT completo requiere
# plantillas Batch/Config específicas de clúster no disponibles en SC3).
#
# Procedencia DGEMM (CAT-01, F3.1 ampliación 2026-08-01): kernels/dgemm/dgemm_bench.c,
# driver propio sobre cblas_dgemm sin escribir álgebra lineal propia --
# usa OpenBLAS del sistema (openblas-devel, confirmado instalado en felix,
# sin necesidad de módulo). Séptimo kernel del dataset, decidido en
# docs/retoma/Propuesta_Seleccion_Kernels_Dataset.md sección 4: EP es un
# extremo compute-bound tan pronunciado (casi sin tráfico de memoria) que
# no puebla la zona cercana al ridge point desde el lado derecho; DGEMM sí,
# y el tamaño de matriz (--size, pasado por CLI, no en tiempo de compilación)
# permite agregar más size_variant después sin recompilar. N=2048 fue el
# primer tamaño evaluado con runtime real razonable (~12s con 6 iteraciones);
# reposicionar en el plano Roofline exacto queda pendiente de la calibración
# real (F4.2/F4.3, i_ridge todavía no medido). Comparte success_check y los
# patrones flops_rate/runtime_seconds con los kernels NPB (mismo formato de
# salida, "Time in seconds"/"Mop/s total"/"Verification").

kernels:
  - id: stream_official
    suite: STREAM
    role: calibration
    exec_path: bin/stream_c
    reports_bandwidth_stdout: true
    bandwidth_stdout_pattern: "Triad:\\s+([0-9.]+)" # MB/s; confirmado contra stdout real en felix
    bandwidth_stdout_unit_multiplier: 1000000 # MB/s -> B/s (ARC-42)
    success_check: {type: stdout_regex, pattern: "Solution Validates"}
    binary_checksum:
      felix-sc3: "sha256:357ef034acf95ede768bf8788a7cdabf92f9afeadbaf79321730659b3cd9199c"
      # ARC-125: recompilado con -march=native (Intel Advisor confirmo que
      # sin esa flag GCC nunca generaba AVX-512, ver Registro_Cambios ARC-125).
      pacca-a100: "sha256:aa85c916a9e39063c927d978b74c10cc30287521a672bc6c600ea04b9567b4fc"
    # 3 arreglos x 8 bytes x STREAM_ARRAY_SIZE (64_000_000) = 1_536_000_000 B;
    # 1.5 GiB con margen para el allocator. F4.2, C05 no distingue role, asi
    # que las entradas de calibracion tambien necesitan este campo.
    estimated_memory_bytes: 1610612736

  - id: ert_probe
    suite: ERT
    role: calibration
    exec_path: bin/ert_probe
    reports_flops_stdout: true
    flops_stdout_pattern: "GFLOPs/sec:\\s+([0-9.]+)" # confirmado contra stdout real en felix
    flops_stdout_unit_multiplier: 1000000000 # GFLOP/s -> FLOP/s (ARC-42)
    success_check: {type: exit_code}
    # Buffer maximo del barrido (4 MiB/hilo) x hasta 8 hilos, x2 de margen.
    estimated_memory_bytes: 67108864
    binary_checksum:
      felix-sc3: "sha256:aafd773346eb05a51a77720e08f45e7bd4cfc5aae31bc25d9f1273c49ed0e0d9"
      # ARC-125: recompilado con -march=native -- el binario anterior nunca
      # generaba AVX-512 (Vector ISA: SSE2, confirmado con Intel Advisor),
      # midiendo un P_pico ~8x por debajo del real (71.8 -> 404.6 GFLOP/s
      # en el smoke test de 8 hilos). Ver Registro_Cambios ARC-125.
      # ARC-126: -march=native solo dejaba a GCC eligiendo AVX2, no AVX-512
      # -- agregado tambien -mprefer-vector-width=512 (417.8-555 GFLOP/s).
      # ARC-158: el driver de kernels/ert/ert_probe.c abria una region
      # OpenMP nueva por cada combinacion del barrido y tomaba el MAXIMO
      # GFLOPs/sec entre docenas de mediciones -- algunas de solo 31-63
      # microsegundos, dominadas por overhead de sincronizacion, no computo
      # real (por eso el "pico" no escalaba con la frecuencia de CPU
      # fijada). Corregido con repeticiones adaptativas por tamano de
      # trabajo (una sola medicion fiable de >=1ms por tamano). Mismas
      # flags de compilacion (-O3 -march=native -mprefer-vector-width=512
      # -fopenmp), recompilado en paccaA100. Checksum FINAL, con el fix.
      pacca-a100: "sha256:562cf51d4c45bc1917d5565d41cc8a333f9c4e1ff9888b47807d56894358a08f"

  # npb_ep se quitó del catálogo (2026-08-06): su "Mop/s total" reporta
  # "Operation type = Random numbers generated" en su propio stdout, no
  # punto flotante -- usarlo como FLOPs/s en operational_intensity es un
  # error de unidades. Además, EP casi no toca memoria (delta_cache_misses
  # con mediana 0), así que >87% de sus ventanas ya salían
  # intensity_undefined de por sí. Reemplazado por npb_bt (confirmado
  # "Operation type = floating point" en pacca).
  - id: npb_bt
    suite: NPB-OMP
    role: dataset
    exec_path: bin/bt.B.x
    phase_label_hint: intermedio # sin confirmar en literatura para este hardware -- que lo diga la medición real, no un supuesto
    size_variant: B
    expected_runtime_seconds: 30 # medido en pacca (6 hilos, pinned): 24.55 s
    # ARC-81: medido, no puesto a ojo -- CV% de IPC estable (<5%, dos
    # ventanas de 15 muestras consecutivas) a partir de ~0.060s, consistente
    # en 3 repeticiones (0.0601/0.0611/0.0601 s). warmup = raw*1.2.
    warmup_seconds: 0.08
    estimated_memory_bytes: 536870912 # medido en pacca: 181576 KB de pico, con margen
    success_check: {type: stdout_regex, pattern: "Verification\\s*=\\s*SUCCESSFUL"}
    binary_checksum:
      pacca-a100: "sha256:9d07435d10dab4eec6c494df502c074dd9261088cc9c96f32ad1c17e86b6590c"
    flops_rate_stdout_pattern: "Mop/s total\\s*=\\s*([0-9.]+)"
    runtime_seconds_stdout_pattern: "Time in seconds\\s*=\\s*([0-9.]+)"

