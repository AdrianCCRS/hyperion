  # ARC-193 (2026-08-23): los binary_checksum de TODOS los kernels GPU de
  # este bloque (hasta rodinia_dwt2d) se recalcularon sobre binarios
  # DESPOJADOS ("strip --strip-all"), no sobre los originales. Mismo
  # hallazgo que ARC-186 encontro para gpu_phasic: nvcc no da binarios
  # reproducibles byte a byte -- una reconstruccion futura desde la misma
  # fuente con los mismos flags da otro sha256, y el codigo ejecutable en
  # si es identico, solo cambian metadatos de depuracion con rutas
  # temporales aleatorias. Antes de esta correccion, estos 8 binarios (los
  # 2 restantes, rodinia_myocyte/rodinia_dwt2d, son SCRIPTS de shell, no
  # ELF -- deterministas por construccion, "strip" los rechazo
  # correctamente con "File format not recognized" y sus checksums no
  # cambiaron) habrian fallado C02 en cualquier reconstruccion legitima.
  # Los originales sin despojar quedan respaldados en
  # ~/hyperion-kernels/bin_unstripped_backup_20260823 en pacca. Verificado
  # funcionalmente tras despojar: rodinia_gaussian, cublas_dgemm_bench (con
  # LD_LIBRARY_PATH correcto -- el fallo sin él es identico en el binario
  # SIN despojar, no una regresion del strip), babelstream_cuda,
  # ert_probe_gpu, rodinia_lavamd y rodinia_heartwall corren igual que
  # antes.
  #
  # ARC-70: primeros kernels GPU del catalogo (Fase 1 de
  # docs/general/plan_trabajo_grado.md -- caracterizacion, sin modelo ni
  # control de reloj todavia, ver Diseno_Politica_DVFS_CPU_GPU.md). Solo
  # pacca-a100 en binary_checksum -- felix no tiene GPU. device: gpu activa
  # --enable-gpu + el shim LD_PRELOAD de blocking-sync en runner.py.

  - id: gpu_stream_bw
    suite: BabelStream
    role: calibration
    device: gpu
    exec_path: bin/babelstream_cuda
    exec_args: "--arraysize 100000000"
    reports_bandwidth_stdout: true
    bandwidth_stdout_pattern: "Triad\\s+([0-9.]+)" # MB/s; confirmado contra stdout real en paccaA100 (ARC-70)
    bandwidth_stdout_unit_multiplier: 1000000 # MB/s -> B/s, mismo criterio que stream_official
    success_check: {type: exit_code}
    estimated_memory_bytes: 2952790016 # 3 arreglos x 100_000_000 x 8 B = 2.4 GB, con margen
    binary_checksum:
      pacca-a100: "sha256:3fba85e18ebe938f328e842fa912bcb93e816ce4b79e007fe0405d4d581e59fb"

  # ARC-76: `gpu_dgemm_calibration` (cuBLAS) YA NO se usa para derivar el
  # ridge point de GPU. `ncu` confirmo que cuBLAS elige aqui, sin que se le
  # pida, una ruta acelerada por Tensor Cores (`cutlass_80_tensorop_d884gemm`)
  # -- comparar los demas kernels (CUDA escrito a mano, sin Tensor Cores)
  # contra ese techo era una comparacion invalida (mismo error de unidades
  # incompatibles que ARC-57 corrigio para npb_ep/npb_is, aplicado aqui al
  # eje de computo). Se mantiene en el catalogo como referencia informativa
  # de "que tan rapido va cuBLAS en este nodo", no como fuente del ridge --
  # ver gpu_ert_probe_fp32/gpu_ert_probe_fp64 mas abajo, que sí se usan para
  # eso.
  - id: gpu_dgemm_calibration
    suite: cuBLAS-DGEMM
    role: calibration
    device: gpu
    exec_path: bin/cublas_dgemm_bench
    reports_flops_stdout: true
    exec_args: "--size 4096 --iterations 10"
    flops_stdout_pattern: "Mop/s total\\s*=\\s*([0-9.]+)" # confirmado contra stdout real en paccaA100 (ARC-70)
    flops_stdout_unit_multiplier: 1000000 # Mop/s -> op/s
    success_check: {type: stdout_regex, pattern: "Verification\\s*=\\s*SUCCESSFUL"}
    estimated_memory_bytes: 536870912 # 3 matrices 4096^2 x 8 B ~= 384 MB, con margen
    binary_checksum:
      pacca-a100: "sha256:896c3a2556f0ca2df64673d3b1dc6232aa42c667a1e563a792f476cc2ed2c174"

  # ARC-76: microbenchmark propio de FLOPs pico de GPU (kernels/gpu/ert_probe_gpu.cu),
  # equivalente CUDA de ert_probe.c -- un bucle FMA que cada hilo corre
  # enteramente en un registro, sin cuBLAS ni ninguna libreria de NVIDIA que
  # pueda elegir Tensor Cores por su cuenta. Dos entradas (FP32/FP64) porque
  # el ridge point correcto depende de la precision del kernel que se va a
  # clasificar (la mayoria de Rodinia es FP32; lavaMD es FP64). Medido en
  # paccaA100: FP64=4698.6 GFLOP/s (~48% del pico teorico NVIDIA de 9.7
  # TFLOP/s), FP32=10178.2 GFLOP/s (~52% del pico teorico de 19.5 TFLOP/s) --
  # ambos plausibles para un probe simple sin tuning agresivo. Con
  # BW_pico=1.399 TB/s (gpu_stream_bw): i_ridge_fp64_vainilla ≈ 3.36
  # FLOP/byte, i_ridge_fp32_vainilla ≈ 7.28 FLOP/byte -- estos son los ridge
  # que se usan para clasificar los kernels Rodinia (ver comentarios en cada
  # uno), no el ~7.4 derivado de cuBLAS de ARC-70/72 (descartado, ver arriba).
  - id: gpu_ert_probe_fp32
    suite: ERT-GPU
    role: calibration
    device: gpu
    gpu_precision: fp32
    exec_path: bin/ert_probe_gpu
    reports_flops_stdout: true
    exec_args: "fp32"
    flops_stdout_pattern: "GFLOPs/sec:\\s+([0-9.]+)"
    flops_stdout_unit_multiplier: 1000000000 # GFLOP/s -> FLOP/s
    success_check: {type: exit_code}
    estimated_memory_bytes: 134217728 # 32M floats ~= 128 MB
    binary_checksum:
      pacca-a100: "sha256:9c2e86216387e58e9c908d1ed6933c89def56116cbe4b5f53b56c9b71f8e59f5"

  - id: gpu_ert_probe_fp64
