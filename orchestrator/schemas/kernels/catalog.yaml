    # pasos de simulacion se acumulen -- mismo tipo de senal degenerada que
    # ARC-84 encontro en otros 3 kernels. No se puede medir warmup real
    # para este kernel; se mantiene el valor heredado (1.0s, igual al resto
    # de kernels sin medicion posible) en vez de confiar en el 0.78s que
    # devuelve measure_warmup.py sobre esta senal contaminada.
    warmup_seconds: 1.0
    estimated_memory_bytes: 33554432 # con margen, dataset pequeno (EDOs por lanzamiento)
    success_check: {type: exit_code}
    binary_checksum:
      pacca-a100: "sha256:cc2e1b507d7e4c88d338720ea19ab39691e5a526510acf4ad1256abe8214ae07"
    # ncu --launch-count 5 (ARC-75): 0.017 FLOP/byte, FP32 (#define fp
    # float) -- memory_bound con margen de dos ordenes de magnitud,
    # refuta la hipotesis inicial de "compute" por completo. Verificado
    # estable con datos de entrada reales (y.txt/params.txt sinteticos,
    # no el caso degenerado que produce el binario sin ellos) y con
    # datos degenerados: mismo resultado en ambos casos.

  - id: rodinia_dwt2d
    suite: Rodinia
    role: dataset
    device: gpu
    exec_path: bin/rodinia_dwt2d
    # -9 (transformada 9/7, FP32) es obligatorio: la variante -5 (5/3) es
    # aritmetica entera pura, mismo defecto que npb_is/npb_ep (ARC-57) --
    # no hay FLOPs que medir. No cambiar sin volver a confirmar el tipo
    # del kernel CUDA en el fuente.
    # ARC-86: imagen 192x192->16384x16384 (generate_rodinia_synthetic_inputs.py
    # --dwt2d-size) para poder medir warmup con datos reales -- el binario
    # resuelve la ruta del BMP el mismo internamente (dirname(argv[0]) +
    # "../../data/dwt2d/"), asi que el argumento sigue siendo solo el
    # nombre del archivo, sin importar el cwd del harness. Remedido con
    # ncu: 2.17 FLOP/byte (antes 4.10 a 192x192) -- baja porque a esta
    # escala el filtro DWT deja de caber tan bien en cache y aumenta el
    # trafico DRAM sostenido, pero sigue muy por debajo de cualquier ridge
    # FP32 posible (~7.28, ARC-76): la clasificacion memory_bound no cambia.
    exec_args: "-d 16384x16384 -f -9 test_16384.bmp"
    phase_label_hint: memory_bound
    operational_intensity_flops_per_byte: 2.17
    gpu_precision: fp32
    size_variant: "16384x16384_97"
    expected_runtime_seconds: 20 # medido en paccaA100: 7.56 s binario puro
    # ARC-86: la conclusion original ("gpu_power_mw nunca supera 46.6W en
    # toda la corrida") NO SE PUDO REPRODUCIR (ARC-190, reverificado
    # 2026-08-23 sobre pacca_gpu_dvfs_20260820, misma imagen 16384x16384):
    # en F0 la potencia real va de 59.6W a 83.5W (media 65.1W), muy por
    # ENCIMA del piso de reposo medido en vivo para ese nivel (53.8W).
    # 97 % de las ventanas estan por encima de 60W. El comentario original
    # esta mal, probablemente medido bajo una condicion distinta a la
    # documentada -- no se elimina, se corrige, para no perder el rastro.
    #
    # Lo que SI es real y explica por que gpu_util_pct (21.6% de ventanas
    # >=5%) subestima la actividad: dwt2d muestra potencia elevada con
    # utilizacion NVML baja, la firma tipica de un kernel memory-bound
    # (OI=2.17 declarado arriba) que ocupa la SM poco (muchos ciclos en
    # espera de memoria) pero SI mueve DRAM real. gpu_util_pct mide
    # "fraccion de tiempo con algun kernel corriendo", no intensidad de
    # trabajo -- no es el metro correcto para este patron.
    #
    # PERO no es un caso limpio para el criterio de potencia tampoco
    # (ARC-185/189): el exceso sobre reposo se DESPLOMA con la frecuencia
    # mucho mas que en dgemm/gaussian/heartwall -- en F4 el exceso medido
    # cae a ~1W, indistinguible del ruido de la propia sonda de reposo.
    # Con potencia Y utilizacion en desacuerdo, y ese desacuerdo variando
    # con el nivel, la decision de incluir este kernel en la matriz final
    # queda ABIERTA -- no se resuelve solo corrigiendo este comentario.
    # Ver docs/general/PLAN_MAESTRO_FASE2.md Anexo G.
    #
    # warmup_seconds se mantiene en el valor heredado 1.0s en vez del
    # 0.537s que measure_warmup.py propuso originalmente sobre la señal
    # que ARC-86 creyó degenerada -- con la corrección de arriba, esa
    # señal SÍ tiene actividad real, así que 0.537s podría ser válido,
    # pero no se remide aquí: cambiar warmup a la baja exige confirmar
    # que no recorta el arranque real, y eso no se ha hecho.
    warmup_seconds: 1.0
    # ARC-86: memoria real medida con nvidia-smi (16384x16384): ~8352 MiB,
    # con margen ~50% sobre eso (antes 16 MB, calibrado para 192x192).
    estimated_memory_bytes: 12884901888
    success_check: {type: exit_code}
    binary_checksum:
      pacca-a100: "sha256:d88d0610dbc5d25013752bdfc3b0f7712962555e36e8ee044a230f12e816ee9c"
    # ncu (ARC-75): 4.10 FLOP/byte, FP32 confirmado en el kernel CUDA
    # (fdwt97Kernel) -- memory_bound confirmado. BMP de entrada sintetico:
    # ver scripts/pacca/generate_rodinia_synthetic_inputs.py.

  - id: dgemm_n2048
    suite: DGEMM-OpenBLAS
    role: dataset
    exec_path: bin/dgemm_bench
    # ARC-83: --iterations 6->80. La corrida original (~0.255s en pacca) era
    # más corta que cualquier warmup separable -- confirmado dos veces
    # (ARC-71, ARC-81). Aumentar iteraciones no cambia la intensidad
    # operacional (misma multiplicación repetida más veces, no un tamaño de
    # problema distinto), así que no invalida ninguna medición de ncu ya
    # hecha -- solo diluye el transitorio de arranque en una fracción menor
    # del total. Medido en pacca: 2.82 s con 80 iteraciones.
    exec_args: "--size 2048 --iterations 80"
    phase_label_hint: compute_bound
    size_variant: N2048
    # 3.31 s instrumentados en REF en la campaña 20260813; 6 s conserva
    # margen para el extremo F4 sin cambiar el tamaño del problema.
    expected_runtime_seconds: 6
    warmup_seconds: 0.5
    estimated_memory_bytes: 134217728 # 3 arreglos x 2048^2 x 8 B ~= 96 MB, con margen
    success_check: {type: stdout_regex, pattern: "Verification\\s*=\\s*SUCCESSFUL"}
    binary_checksum:
      felix-sc3: "sha256:289e373178e6f4d0c949fa324c39b3caee6a19b42653a941157298a87b5176ad"
      pacca-a100: "sha256:a7f6919efa28ebf5a9341c9bfbb5463b139209ea4928712e3872cc1da311d06b"
    flops_rate_stdout_pattern: "Mop/s total\\s*=\\s*([0-9.]+)"
    runtime_seconds_stdout_pattern: "Time in seconds\\s*=\\s*([0-9.]+)"

  # Candidato CPU caracterizado en REF antes de incorporarlo a la campaña
  # final. Fuente externa sin cambios algorítmicos: Rodinia commit
  # 9c10d3ea16ddba2ba057cc3951a9efc4c2cc18a4, openmp/lavaMD. main.h fija
  # `fp` como double; el binario se reproduce con
  # scripts/pacca/build_rodinia_lavamd_omp.sh. La distribución empírica de
  # etiquetas, no este comentario ni el tipo de kernel, decide su inclusión.
  - id: rodinia_lavamd_omp
    suite: Rodinia-OpenMP
    role: dataset
    exec_path: bin/rodinia_lavamd_omp
    exec_args: "-cores 6 -boxes1d 24"
    phase_label_hint: intermedio
    size_variant: boxes1d24
    # 7.44--7.54 s instrumentados en 10 repeticiones REF; 12 s cubre la
    # proyección conservadora al extremo F4 antes del factor RUN-03 x3.
    expected_runtime_seconds: 12
    warmup_seconds: 0.5
    estimated_memory_bytes: 157286400 # RSS medido 108680 KiB, con margen
    # Rodinia LavaMD no incluye verificador numérico. Este patrón exige que
    # el binario confirme los inputs y alcance el final temporizado del
    # kernel; la limitación queda registrada y no se presenta como checksum
    # de resultado.
    success_check:
      type: stdout_regex
      pattern: "(?s)Configuration used:\\s*cores = 6, boxes1d = 24.*Total time:\\s*[0-9.]+ s"
    binary_checksum:
      pacca-a100: "sha256:92cb259bd2ca1d0a67a4d52490b76cdb2eb844568c7e73864023c52d7abb2648"
    # ARC-187: mismo texto que success_check confirma que existe ("Total
    # time:\n7.732188224792 s") -- cierra el hueco de T0.2b, que no podía
    # recalcular alpha para este kernel por falta de este patrón.
    runtime_seconds_stdout_pattern: "Total time:\\s*([0-9.]+)\\s*s"

  # Segundo candidato CPU, medido solo después de comprobar que LavaMD no
  # basta para aliviar el desbalance global. RAJAPerf v2025.12.1,
  # Polybench_3MM/Base_OpenMP, Real_type=double (RP_USE_DOUBLE del build).
  # El adaptador verifica en cada ejecución tanto el checksum del ELF real
  # como el checksum numérico que RAJAPerf genera para el resultado.
  - id: rajaperf_polybench_3mm_omp
    suite: RAJAPerf-OpenMP
    role: dataset
    exec_path: bin/rajaperf_polybench_3mm_omp
    exec_args: "--repfact 10 --sizefact 1"
    phase_label_hint: intermedio
    size_variant: default_x10reps
    # 12.65--12.94 s instrumentados con repfact=10 en 10 repeticiones REF;
    # 25 s deja margen para el extremo F4 antes del factor RUN-03 x3.
    expected_runtime_seconds: 25
    warmup_seconds: 0.5
    estimated_memory_bytes: 100663296 # 59.36 MB asignados, RSS 62.7 MB, con margen
    success_check: {type: stdout_regex, pattern: "Verification\\s*=\\s*SUCCESSFUL"}
    binary_checksum:
      pacca-a100: "sha256:386fd7a0db562f12a872891268270171e289be744cebc86c94595d61239c467d"

  # --- ARC-176: cargas para la zona alpha <= 0.224 ------------------------
  # Los 9 kernels del dataset tienen alpha en [0.384, 1.026]. Con el modelo
  # de potencia real de paccaA100 (116.5 W a 3200 MHz -> 83.4 W a 800 MHz),
  # bajar la frecuencia solo mejora el EDP si alpha <= 0.224. Ninguna carga
  # actual llega a esa zona, y por eso ninguna se beneficia de DVFS.
  # Estas dos existen para poblarla.

  - id: ptrchase
    suite: HYPERION-PHASE
    role: dataset
    exec_path: bin/ptrchase
    # 512 MiB desborda con holgura la LLC de 12 MiB de este SKU, forzando
    # DRAM en cada salto. La permutacion es reproducible (--seed fijo): si
    # cambiara entre niveles de frecuencia, cambiaria el patron de fallos y
    # las corridas no serian comparables.
    exec_args: "--size-mib 512 --iterations 6 --seed 20260806"
    phase_label_hint: memory_bound
    size_variant: MIB512
    expected_runtime_seconds: 12
    warmup_seconds: 0.5
    estimated_memory_bytes: 671088640  # 512 MiB de buffer + permutacion
    success_check: {type: stdout_regex, pattern: "Verification\\s*=\\s*SUCCESSFUL"}
    binary_checksum:
      pacca-a100: "sha256:cb790802b39cb180fd7741ab21167cc018e7253f867136482ef706cbc49f357f"

  # phasic: tres variantes que solo difieren en el PERIODO de fase. Es lo
