    # por cuadro, así que el costo escala ~5.7 ms/cuadro bajo instrumentacion
    # (vs. ~0.2 ms/cuadro en el binario sin instrumentar): a 20000 cuadros el
    # run tardo 115 s reales (medido), muy por encima de cualquier ventana
