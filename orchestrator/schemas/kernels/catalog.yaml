    exec_path: bin/ert_probe_gpu
    exec_args: "fp64"
    reports_flops_stdout: true
    flops_stdout_pattern: "GFLOPs/sec:\\s+([0-9.]+)"
    flops_stdout_unit_multiplier: 1000000000 # GFLOP/s -> FLOP/s
    success_check: {type: exit_code}
    estimated_memory_bytes: 268435456 # 32M doubles ~= 256 MB
    binary_checksum:
      pacca-a100: "sha256:9c2e86216387e58e9c908d1ed6933c89def56116cbe4b5f53b56c9b71f8e59f5"

  # Mismo binario que gpu_dgemm_calibration, id distinto porque aqui juega
  # el rol de dataset (compute_bound), no de calibracion -- exactamente el
  # mismo patron que dgemm_n2048 en CPU. 68.0 FLOP/byte, pero -- correccion
  # ARC-110, no era del todo preciso decir solo "confirmado con ncu" -- el
  # NUMERADOR de FLOPs no viene de contar instrucciones con ncu (a
  # diferencia de los kernels Rodinia de mas abajo): es el conteo
  # analitico del algoritmo (2*n^3*iteraciones, mismo criterio que
  # dgemm_n2048 en CPU y que el propio "Mop/s total" que imprime el
  # binario). ncu solo aporta el denominador (dram__bytes.sum) y la
  # confirmacion de que la ruta de ejecucion es Tensor Core (DMMA) --
  # verificado en esta revision: sm__inst_executed_pipe_tensor_op_dmma.sum
  # > 0 y sm__sass_thread_inst_executed_op_dfma_pred_on.sum = 0 en el
  # mismo perfilado, confirmando que el metodo de conteo de instrucciones
  # clasico (el que SI usan los scripts de docs/justifications/scripts/
  # para los kernels Rodinia) daria ~0.008 FLOP/byte para este kernel --
  # cuatro ordenes de magnitud por debajo de 68.0. El valor analitico se
  # verifico independientemente contra el propio "Mop/s total" del binario
  # (687,259 M-ops observadas vs 687,195 M-ops analiticas para 5
  # lanzamientos, <0.01% de diferencia) -- el numero es correcto, no un
  # bug; lo que faltaba era declarar que su procedencia es distinta a la
  # de los demas kernels GPU del catalogo. 68.0 FLOP/byte sigue muy por
  # encima de cualquier ridge posible en este nodo (3.36-7.28 FLOP/byte,
  # ARC-76), asi que compute_bound se mantiene sin ambiguedad pase lo que
  # pase con la ruta de ejecucion (Tensor Core o no).
  - id: gpu_dgemm_n4096
    suite: cuBLAS-DGEMM
    role: dataset
    device: gpu
    exec_path: bin/cublas_dgemm_bench
    # ARC-83: --iterations 10->300, mismo motivo que dgemm_n2048 (CPU): la
    # corrida original (~0.13s) era mucho mas corta que el warmup declarado
    # (1.0s) -- 0 ventanas gpu_telemetry utilizables mas alla del warmup.
    # Mas iteraciones no cambia la intensidad operacional (misma
    # multiplicacion repetida), no invalida la medicion de ncu (68.0
    # FLOP/byte).
    exec_args: "--size 4096 --iterations 300"
    phase_label_hint: compute_bound
    operational_intensity_flops_per_byte: 68.0
    gpu_precision: fp64
    size_variant: N4096
    expected_runtime_seconds: 10 # medido en paccaA100 con 300 iter: 4.94 s, verificado con corrida instrumentada real (ARC-83) -- compute_bound confirmado (68.0 vs ridge 3.68)
    # ARC-83: 1.0s ya era razonable -- verificado con la corrida larga real:
    # el detector de warmup encuentra ~0.80s (propuesto ~0.96s), casi
    # idéntico al valor ya declarado. Sin cambio.
    warmup_seconds: 1.0
    estimated_memory_bytes: 536870912
    success_check: {type: stdout_regex, pattern: "Verification\\s*=\\s*SUCCESSFUL"}
    binary_checksum:
      pacca-a100: "sha256:896c3a2556f0ca2df64673d3b1dc6232aa42c667a1e563a792f476cc2ed2c174"
    flops_rate_stdout_pattern: "Mop/s total\\s*=\\s*([0-9.]+)"
    runtime_seconds_stdout_pattern: "Time in seconds\\s*=\\s*([0-9.]+)"

  # ARC-110: rodinia_hotspot se retiro del catalogo -- una auditoria de
  # precision (pedida explicitamente por el usuario) encontro que, pese a
  # declararse fp32, ejecuta 30.4% de sus FLOPs reales en FP64 (medido con
  # ncu solicitando ambas precisiones simultaneamente, no solo la
  # declarada). Con esa mezcla, la intensidad operacional real (7.21
  # FLOP/byte) queda justo en el borde del ridge FP32 (~7.28-7.98) -- muy
  # distinto del 5.02 FLOP/byte que el metodo anterior (solo contadores
  # FP32) reportaba, y no hay una base solida para decidir contra que
  # techo comparar un kernel mixto sin disenar un Roofline multitecho
  # (fuera de alcance de este trabajo). Se prefirio retirarlo a asignarle
  # un ridge arbitrariamente. Reemplazado por rodinia_gaussian (ver abajo)
  # -- mismo principio que npb_ep/pathfinder ya aplicado antes (ARC-57/72):
  # que lo diga la medición, y si la medición no permite una clasificación
  # defendible, no forzarla.
  #
  # Rodinia (terceros, sin modificar -- mismo principio que NPB en CPU).
  # Eliminacion Gaussiana (Dense Linear Algebra), sin archivo de entrada
  # externo (genera su propia matriz internamente con -s <tamano>).
  # Precision confirmada por codigo fuente (float, sin uso de double) y
  # verificada empiricamente con ncu solicitando ambas precisiones
  # simultaneamente (ARC-110): 100% FP32, fp64=0 exacto -- sin mezcla.
  # phase_label_hint=intermedio a propósito, mismo criterio que el resto
  # del catalogo Rodinia: no hay literatura Roofline que contradecir, que
  # lo diga la medición.
  - id: rodinia_gaussian
    suite: Rodinia
    role: dataset
    device: gpu
    exec_path: bin/rodinia_gaussian
    # ARC-110: -s 4096 (matriz generada internamente) para un runtime de
    # varios segundos -- 6.4s medido en paccaA100 (5.94s de kernels CUDA,
    # el resto transferencias H2D/D2H).
    exec_args: "-s 4096"
    phase_label_hint: intermedio
    # ARC-110: 0.2814 FLOP/byte, medido con ncu (--launch-count 20) sobre
    # los primeros 20 lanzamientos de kernel de un total de ~8190 (n-1
    # pasos de eliminacion x 2 kernels Fan1/Fan2 cada uno) -- NO es un
    # promedio de la corrida completa, es una muestra del inicio del
    # algoritmo (los pasos con la submatriz de trabajo mas grande, ya que
    # el trabajo por paso decrece a medida que avanza la eliminacion).
    # Perfilar los ~8190 lanzamientos completos con ncu no es practico
    # (costo de perfilado por lanzamiento). La clasificacion memory_bound
    # es robusta a esta limitacion: 0.2814 esta muy por debajo de
    # cualquier ridge posible en este nodo (3.36-7.98 FLOP/byte), asi que
    # incluso un promedio de toda la corrida tendria que estar mas de un
    # orden de magnitud por encima para cambiar la clasificacion.
    operational_intensity_flops_per_byte: 0.2814
    gpu_precision: fp32
    size_variant: N4096
    expected_runtime_seconds: 8 # medido en paccaA100: 6.4 s
    # ARC-110: warmup_seconds puesto a mano, NO medido con measure_warmup.py
    # (a diferencia de rodinia_hotspot/dwt2d, que si tuvieron esa medicion
    # dedicada) -- 0.5s es conservador frente a los ~0.19s de overhead de
    # transferencia medidos (6.14s totales - 5.94s de kernels CUDA), pero
    # queda como limitacion explicita, no una medicion real.
    warmup_seconds: 0.5
    estimated_memory_bytes: 268435456 # 2 matrices 4096^2 x 4 B + vectores ~128 MB, con margen
    success_check: {type: exit_code}
    binary_checksum:
      pacca-a100: "sha256:396a0777118b360442f2987f8b5447fcd4eac60c4f94500892c82dd79d29677d"

  # Rodinia (terceros). phase_label_hint=memory_bound: medición real (ncu,
  # ARC-70: 0.087 FLOP/byte) muy por debajo de cualquier ridge posible en
  # este nodo (3.36-7.28 FLOP/byte, ARC-76) -- acceso irregular a memoria
  # (backpropagation), casi sin reuso aritmético por byte movido.
  # ARC-110: gpu_precision corregido de fp32 a fp64 -- una auditoria de
  # precision (ncu solicitando ambas precisiones simultaneamente, en vez
  # de solo la declarada) encontro que este kernel ejecuta 82.3% de sus
  # FLOPs reales en FP64, no FP32 como declaraba el catalogo desde su
  # incorporacion original (ARC-72). operational_intensity_flops_per_byte
  # tambien se remidio con el metodo corregido (0.45 FLOP/byte, antes
  # 0.0799 solo-FP32) -- la clasificacion memory_bound no cambia (ambos
  # valores estan ordenes de magnitud por debajo de cualquier ridge
  # posible en este nodo), pero la metadata ahora refleja lo medido, no
  # el diseno original del kernel.
  - id: rodinia_backprop
    suite: Rodinia
    role: dataset
    device: gpu
    exec_path: bin/rodinia_backprop
    # ARC-86 (diagnostico): 524288->1048560, el maximo seguro antes del
    # limite de gridDim.y=65535 ya documentado en ARC-72 (num_blocks=in/16).
    # Sin embargo backprop solo lanza 2 kernels en total (forward + ajuste
    # de pesos, sin bucle de epocas en el codigo CUDA) -- incluso al tamano
    # maximo el binario puro solo tarda 0.68s, por lo que puede que no haya
    # suficiente duracion para una medicion de warmup robusta sin importar
    # el tamano (a diferencia de hotspot/myocyte/heartwall/lavamd, aqui no
    # hay margen de tamano que crecer mas alla del limite de CUDA). Remedido
    # con ncu: 0.0799 FLOP/byte (antes 0.087 a in=524288), sin cambio de
    # clasificacion (memory_bound con margen de dos ordenes de magnitud
    # frente a cualquier ridge posible).
    exec_args: "1048560"
    phase_label_hint: memory_bound
    operational_intensity_flops_per_byte: 0.45
    gpu_precision: fp64
    size_variant: "1048560"
    expected_runtime_seconds: 5 # medido en paccaA100 (con harness): 1.28 s
    # ARC-86: incluso al tamano maximo seguro, gpu_power_mw se queda plano
    # en el piso de idle (36.5-40W) durante toda la corrida -- los blips de
    # gpu_util_pct (0->3->4%) no se corresponden con ningun aumento real de
    # potencia, a diferencia de lavamd/heartwall donde el salto de potencia
    # confirma la transicion. Mismo tipo de senal degenerada que
    # rodinia_myocyte (ARC-86) y los kernels de ARC-84: no se puede medir
    # warmup real aqui, sin importar el tamano (backprop solo lanza 2
    # kernels en total). Se mantiene el valor heredado (1.0s) en vez de
    # confiar en el 0.635s que devuelve measure_warmup.py (changepoint)
    # sobre ruido de bajo nivel.
    warmup_seconds: 1.0
    estimated_memory_bytes: 671088640 # con margen sobre ~407 MB de trafico DRAM medido con ncu (antes 187 MB a in=524288)
    success_check: {type: exit_code}
    binary_checksum:
      pacca-a100: "sha256:c708460242321cc5a88b657cd5e05565a7964a7bedc60634e270c6c1e8074ef5"

  # Rodinia (terceros). ARC-75/76: 5 kernels nuevos, medidos con ncu en
  # paccaA100 y verificados contra el ridge correcto por precision (ver
  # docs/retoma/pacca/Consolidacion_Kernels_Dataset_Fase1.md seccion 0 -- el
  # i_ridge_gpu=7.4 usado en ARC-70/72 salia de cuBLAS, que eligio sin que
  # se le pidiera una ruta Tensor Core; los demas kernels no usan Tensor
  # Cores, comparacion invalida). Ridge correcto, medido con un probe propio
  # sin cuBLAS (ARC-76, kernels/gpu/ert_probe_gpu.cu, ver gpu_ert_probe_fp32/
  # fp64 mas arriba): ~3.36 FLOP/byte para FP64 vainilla, ~7.28 FLOP/byte
  # para FP32 vainilla. lud/myocyte/dwt2d envueltos en un script wrapper
  # (no se modifica el binario de Rodinia): ambos tienen una ruta de
  # entrada hardcodeada ("../../data/<kernel>/...") relativa al cwd del
  # proceso, incompatible con la convencion del proyecto (cwd fijo en
  # ~/hyperion-kernels para todos los kernels); el wrapper solo hace `cd`
  # a un subdirectorio de profundidad 2 antes de invocar el binario real,
  # para que esa ruta relativa resuelva a hyperion-kernels/data/<kernel>/.
  - id: rodinia_lavamd
    suite: Rodinia
    role: dataset
    device: gpu
    exec_path: bin/rodinia_lavamd
    # ARC-86: boxes1d 10->70 para poder medir warmup con datos reales. A
    # diferencia de xmax/iteraciones en otros kernels, boxes1d SI cambia el
    # tamano del problema (N-Body real, no repeticion de trabajo identico)
    # -- el propio comentario original de ARC-75 ya advertia que este valor
    # es sensible al tamano y exige re-medicion. Remedido con ncu: 708.14
    # FLOP/byte (antes 1233 a boxes1d=10) -- el working set ya no cabe tan
    # bien en L2 a este tamano, mas trafico DRAM sostenido, pero sigue muy
    # por encima de cualquier ridge posible (3.36-7.28, ARC-76): la
    # clasificacion compute_bound no cambia con este margen.
    exec_args: "-boxes1d 70"
    phase_label_hint: compute_bound
    operational_intensity_flops_per_byte: 708.14
    gpu_precision: fp64
    size_variant: "boxes1d70"
    expected_runtime_seconds: 15 # medido en paccaA100 (con harness): 5.99 s
    # ARC-86: warmup medido con datos reales (measure_warmup.py, 993
    # muestras NVML a 5ms) -- fraccion grande (66%) pero real: la traza
    # muestra gpu_power_mw plano en ~37W (idle) desde t=0 hasta t=3.68s,
    # con salto limpio a ~93W (carga real, util 100%) justo en la ventana
    # detectada -- dominado por la inicializacion de contexto CUDA + copia
    # H2D del dataset N-Body de ~3 GB (mucho mayor que a boxes1d=10), no un
    # artefacto del detector. Reemplaza el 1.0s heredado sin respaldo.
    warmup_seconds: 4.3753
    # ARC-86: memoria real medida con nvidia-smi durante la corrida
    # (boxes1d=70): ~2990 MiB -- el N-Body escala ~boxes1d^3, asi que subir
    # de 10 a 70 crece el uso muchisimo mas que el 2x que sugeriria el valor
    # anterior (67108864, calibrado para boxes1d=10). Con margen ~40%.
    estimated_memory_bytes: 4294967296
    success_check: {type: exit_code}
    binary_checksum:
      pacca-a100: "sha256:3d69bb876b53f2f6224bef4a0bfec5438e664607b36308eb5ab9c9b0d7d02a80"
    # ncu (ARC-75): 1233 FLOP/byte (dram__bytes.sum), muy por encima de
    # cualquier ridge posible (3.36-7.28, ARC-76) -- compute_bound
    # confirmado con margen enorme. Precision real: FP64 (#define fp double),
    # sin uso de Tensor Cores. Valor sensible al tamano de boxes1d (dataset
    # pequeno, working set mayormente en L2/registros, poco trafico DRAM
    # sostenido) -- si boxes1d cambia, re-medir con ncu antes de reusar
    # este numero.

  - id: rodinia_heartwall
    suite: Rodinia
    role: dataset
    device: gpu
    exec_path: bin/rodinia_heartwall
    # ARC-86: video sintetico regenerado con 20000 cuadros en el archivo
    # (antes 25, generate_rodinia_synthetic_inputs.py --heartwall-frames)
    # -- se procesan 1000 de esos 20000 (ver mas abajo por que no los
    # 20000). Mismo cuadro repetido mas veces no cambia la intensidad
    # operacional: remedido con ncu a 20000 cuadros procesados: 35.30
    # FLOP/byte (antes 35.3), sin cambio de clasificacion.
    exec_args: "data/heartwall/test.avi 1000"
    phase_label_hint: compute_bound
    operational_intensity_flops_per_byte: 35.3
    gpu_precision: fp32
    size_variant: "1000frames"
    # ARC-86: 1000 en vez de 20000 -- el harness (shim de blocking-sync,
