    phase_label_hint: intermedio
    operational_intensity_flops_per_byte: 7.82
    gpu_precision: fp32
    size_variant: N2048
    expected_runtime_seconds: 12 # medido en paccaA100: 7.99 s (la mayor parte es verificacion CPU O(N^3), no el kernel CUDA)
    warmup_seconds: 1.0
    estimated_memory_bytes: 67108864 # matriz 2048^2 x 4 B (float) ~16 MB, con margen
    success_check: {type: exit_code}
    binary_checksum:
      pacca-a100: "sha256:2b42526c26f72589b9361f70bf57b6926ee4ff86dd4629b7530e458f26a13a32"
    # ncu (ARC-80): 7.82 FLOP/byte exacto para N=2048 (dram__bytes.sum vs
    # FMA+add+mul agregados sobre 200 lanzamientos de kernel reales), FP32,
    # sin Tensor Cores.

  - id: rodinia_myocyte
    suite: Rodinia
    role: dataset
    device: gpu
    exec_path: bin/rodinia_myocyte
    # ARC-86: xmax (duracion de simulacion en ms) 100->100000 para generar
    # suficiente senal NVML para medir warmup real (mismo patron que
    # rodinia_hotspot/ARC-85 -- mas pasos del mismo solver ODE, workload=1
    # y mode=0 sin cambiar, no altera la intensidad operacional).
    # Remedido con ncu: 0.017 FLOP/byte (identico), sin cambio de
    # clasificacion.
    # ARC-110: gpu_precision corregido de fp32 a fp64, y
    # operational_intensity_flops_per_byte de 0.017 a 0.06 -- auditoria de
    # precision (ncu solicitando ambas precisiones simultaneamente) encontro
    # que este kernel ejecuta 71.3% de sus FLOPs reales en FP64, no FP32
    # como declaraba el catalogo desde su incorporacion original (ARC-75).
    # Clasificacion memory_bound sin cambio (ambos valores estan ordenes de
    # magnitud por debajo de cualquier ridge posible en este nodo).
    exec_args: "100000 1 0"
    phase_label_hint: memory_bound
    operational_intensity_flops_per_byte: 0.06
    gpu_precision: fp64
    size_variant: "100000ms_xmax"
    expected_runtime_seconds: 12 # medido en paccaA100: 5.58 s binario puro
    # ARC-86: incluso alargando xmax 1000x (100->100000), gpu_util_pct sigue
    # sin senal real -- blips de 3-19% sin correlacion con gpu_power_mw
    # (37.9W en el tramo "activo" vs 36.6W en el resto, ambos = piso de
