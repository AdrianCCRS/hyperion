  # ARC-181: NPB clase C. El EJE DE TAMANO del plan maestro (Parte V.2).
  #
  # El regimen de un kernel no es propiedad del algoritmo sino del algoritmo
  # CONTRA la jerarquia de memoria de este nodo: la LLC del Gold 5315Y es de
  # 12 MiB por socket. Los seis NPB del dataset estan TODOS en clase B, y
  # ninguno satura memoria (npb_mg, el mas cerca, llega al 74 % del ancho de
  # banda de STREAM; cinco no pasan del 30 %). Subir de clase multiplica el
  # conjunto de trabajo por ~8 y es la forma canonica y citable de barrer
  # ese eje: no exige escribir codigo y produce puntos comparables con toda
  # la literatura de NPB.
  #
  # Los binarios ya estaban construidos en pacca con el mismo
  # scripts/felix/build_npb.sh (que fija -march=native, ARC-125), asi que
  # comparten flags con las entradas de clase B y la comparacion B contra C
  # aisla el tamano.
  #
  # Los tiempos son estimaciones conservadoras a partir de la clase B: el
  # trabajo escala ~8x pero los kernels limitados por memoria escalan peor.
  # Se corrigen con la medicion del pre-vuelo T1.2.

  - id: npb_cg_c
    suite: NPB-OMP
    role: dataset
    exec_path: bin/cg.C.x
    phase_label_hint: memory_bound
    size_variant: C
    expected_runtime_seconds: 220
    warmup_seconds: 0.5
    estimated_memory_bytes: 1288490188  # ~1.2 GiB
