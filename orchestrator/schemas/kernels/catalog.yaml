  # --- 2026-08-25: impulso RAJAPerf-CUDA (Estrategia_GPU_Fase2.md §8) ----
  # 6 candidatos sobrevivientes del tamizaje de alpha
  # (screen_rajaperf_gpu_alpha.sh, job 6517 tras corregir el bug de
  # sizefact): 4 con ajuste limpio (Stream_COPY/TRIAD, Polybench_JACOBI_2D/
  # HEAT_3D) y 2 con alpha bajo pero ajuste de Amdahl ruidoso
  # (Basic_REDUCE3_INT r2=0.749, Basic_INDEXLIST_3LOOP r2=0.575) --
  # incluidos igual (decision 2026-08-25, Estrategia_GPU_Fase2.md riesgo
  # 6): su alpha (0.010/0.013) esta muy por debajo del umbral GPU (0.639),
  # el ruido esta en el AJUSTE, no necesariamente en que sean poco
  # sensibles al reloj.
  #
  # Cada wrapper (bin/gpu_rajaperf_*) fija --sizefact 100: a tamano por
  # defecto el binario esta dominado por arranque de contexto CUDA
  # (~380ms fijos, medido 2026-08-25), no por el kernel -- mismo bug ya
  # corregido en el propio tamizaje. runner.py inyecta LD_PRELOAD del shim
  # de blocking-sync y LD_LIBRARY_PATH de CUDA antes de invocar el
  # wrapper (device: gpu), no hace falta repetirlo en el script.
  #
  # operational_intensity_flops_per_byte/gpu_precision: PENDIENTES DE
  # MEDIR CON ncu (CAT-10 los exige para role: dataset, catalog.py:132-137
  # falla el catalogo entero si faltan). Job 6525
  # (scripts/pacca/measure_gpu_rajaperf_oi.py) encolado, esperando a que
  # 6524 (rejilla fina CPU) libere paccaA100. NO llenar con un valor
  # provisional: mejor que el catalogo falle a cargar (fail closed) que
  # aceptar una campana con OI inventado.

  - id: gpu_rajaperf_stream_copy
    suite: RAJAPerf-CUDA
