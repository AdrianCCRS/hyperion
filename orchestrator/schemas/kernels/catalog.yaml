    # pasos de simulacion se acumulen -- mismo tipo de senal degenerada que
    # ARC-84 encontro en otros 3 kernels. No se puede medir warmup real
    # para este kernel; se mantiene el valor heredado (1.0s, igual al resto
    # de kernels sin medicion posible) en vez de confiar en el 0.78s que
    # devuelve measure_warmup.py sobre esta senal contaminada.
    warmup_seconds: 1.0
    estimated_memory_bytes: 33554432 # con margen, dataset pequeno (EDOs por lanzamiento)
    success_check: {type: exit_code}
    binary_checksum:
      pacca-a100: "sha256:cc2e1b507d7e4c88d338720ea19ab39691e5a526510acf4ad1256abe8214ae07"
    # ncu --launch-count 5 (ARC-75): 0.017 FLOP/byte, FP32 (#define fp
    # float) -- memory_bound con margen de dos ordenes de magnitud,
    # refuta la hipotesis inicial de "compute" por completo. Verificado
    # estable con datos de entrada reales (y.txt/params.txt sinteticos,
    # no el caso degenerado que produce el binario sin ellos) y con
    # datos degenerados: mismo resultado en ambos casos.

  - id: rodinia_dwt2d
    suite: Rodinia
    role: dataset
    device: gpu
    exec_path: bin/rodinia_dwt2d
    # -9 (transformada 9/7, FP32) es obligatorio: la variante -5 (5/3) es
    # aritmetica entera pura, mismo defecto que npb_is/npb_ep (ARC-57) --
    # no hay FLOPs que medir. No cambiar sin volver a confirmar el tipo
    # del kernel CUDA en el fuente.
    # ARC-86: imagen 192x192->16384x16384 (generate_rodinia_synthetic_inputs.py
    # --dwt2d-size) para poder medir warmup con datos reales -- el binario
    # resuelve la ruta del BMP el mismo internamente (dirname(argv[0]) +
    # "../../data/dwt2d/"), asi que el argumento sigue siendo solo el
    # nombre del archivo, sin importar el cwd del harness. Remedido con
    # ncu: 2.17 FLOP/byte (antes 4.10 a 192x192) -- baja porque a esta
    # escala el filtro DWT deja de caber tan bien en cache y aumenta el
    # trafico DRAM sostenido, pero sigue muy por debajo de cualquier ridge
    # FP32 posible (~7.28, ARC-76): la clasificacion memory_bound no cambia.
    exec_args: "-d 16384x16384 -f -9 test_16384.bmp"
    phase_label_hint: memory_bound
    operational_intensity_flops_per_byte: 2.17
    gpu_precision: fp32
    size_variant: "16384x16384_97"
    expected_runtime_seconds: 20 # medido en paccaA100: 7.56 s binario puro
    # ARC-86: la conclusion original ("gpu_power_mw nunca supera 46.6W en
    # toda la corrida") NO SE PUDO REPRODUCIR (ARC-190, reverificado
    # 2026-08-23 sobre pacca_gpu_dvfs_20260820, misma imagen 16384x16384):
    # en F0 la potencia real va de 59.6W a 83.5W (media 65.1W), muy por
    # ENCIMA del piso de reposo medido en vivo para ese nivel (53.8W).
    # 97 % de las ventanas estan por encima de 60W. El comentario original
    # esta mal, probablemente medido bajo una condicion distinta a la
    # documentada -- no se elimina, se corrige, para no perder el rastro.
    #
    # Lo que SI es real y explica por que gpu_util_pct (21.6% de ventanas
    # >=5%) subestima la actividad: dwt2d muestra potencia elevada con
    # utilizacion NVML baja, la firma tipica de un kernel memory-bound
    # (OI=2.17 declarado arriba) que ocupa la SM poco (muchos ciclos en
    # espera de memoria) pero SI mueve DRAM real. gpu_util_pct mide
    # "fraccion de tiempo con algun kernel corriendo", no intensidad de
    # trabajo -- no es el metro correcto para este patron.
    #
    # PERO no es un caso limpio para el criterio de potencia tampoco
    # (ARC-185/189): el exceso sobre reposo se DESPLOMA con la frecuencia
    # mucho mas que en dgemm/gaussian/heartwall -- en F4 el exceso medido
    # cae a ~1W, indistinguible del ruido de la propia sonda de reposo.
    # Con potencia Y utilizacion en desacuerdo, y ese desacuerdo variando
    # con el nivel, la decision de incluir este kernel en la matriz final
    # queda ABIERTA -- no se resuelve solo corrigiendo este comentario.
    # Ver docs/general/PLAN_MAESTRO_FASE2.md Anexo G.
    #
    # warmup_seconds se mantiene en el valor heredado 1.0s en vez del
    # 0.537s que measure_warmup.py propuso originalmente sobre la señal
    # que ARC-86 creyó degenerada -- con la corrección de arriba, esa
    # señal SÍ tiene actividad real, así que 0.537s podría ser válido,
    # pero no se remide aquí: cambiar warmup a la baja exige confirmar
    # que no recorta el arranque real, y eso no se ha hecho.
    warmup_seconds: 1.0
    # ARC-86: memoria real medida con nvidia-smi (16384x16384): ~8352 MiB,
    # con margen ~50% sobre eso (antes 16 MB, calibrado para 192x192).
    estimated_memory_bytes: 12884901888
    success_check: {type: exit_code}
    binary_checksum:
      pacca-a100: "sha256:d88d0610dbc5d25013752bdfc3b0f7712962555e36e8ee044a230f12e816ee9c"

