    # agrega ~10 MB frente a los 25 originales; presupuesto ampliado con
    # margen generoso, muy por debajo de la memoria real de la A100.
    estimated_memory_bytes: 134217728 # con margen sobre buffers de frames + tracking
    # ARC-86: warmup medido con datos reales (measure_warmup.py, 1049
    # muestras NVML a 5ms) -- transicion limpia y real: gpu_util_pct
    # 1.4%->90.8% y gpu_power_mw 37.8W->52.7W (piso de idle -> carga real)
    # en t=0.24s. Reemplaza el 1.0s heredado sin respaldo de medicion.
    warmup_seconds: 0.2929
    success_check: {type: exit_code}
    binary_checksum:
      pacca-a100: "sha256:0693860b0e2b75e010a9a5d2554da58f9b8fd437c2474a72e19142f2876f8f09"
    # ncu (ARC-75): 35.3 FLOP/byte (dram__bytes.sum), FP32, sin Tensor
    # Cores -- compute_bound confirmado contra el ridge FP32 vainilla medido
    # (~7.28, ARC-76). Video sintetico generado localmente (no ffmpeg -- no
    # disponible en el nodo de computo): ver
    # scripts/pacca/generate_rodinia_synthetic_inputs.py.

  - id: rodinia_lud
    suite: Rodinia
    role: dataset
