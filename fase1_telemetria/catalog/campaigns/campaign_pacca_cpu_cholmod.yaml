# Campaña completa CHOLMOD -- 4to y ultimo candidato del pivote de
# catálogo motivado por C8 (Estrategia_CPU_Fase2.md §7.bis/§7.ter), tras
# GAP (negativo total) y LULESH/HPCG (negativo en mezcla, positivo en
# EDP para HPCG). Motivo distinto: factorización supernodal con bloques
# BLAS3 densos embebidos en trabajo disperso -- el patrón que hace a
# `rajaperf_polybench_3mm_omp` el único kernel con mezcla real a
# frecuencia nativa.
#
# NIVELES: los 5 estándar. REPETICIONES: n=6, estándar.

campaign_id: pacca_cpu_cholmod_20260827
environment_tier: hpc_sc3
seed: 20260806

output_dir: /home/latorresn/hyperion-results/campaigns/pacca_cpu_cholmod_20260827
overwrite: true

catalog_path: ../catalog.yaml

calibration:
  - kernel_ref: stream_official
  - kernel_ref: ert_probe

kernels:
  - kernel_ref: cpu_cholmod

frequency_levels:
  - {id: REF, mode: native_governor}
  - {id: F0,  mode: fixed, fraction: 1.0}    # 3200 MHz
  - {id: F1,  mode: fixed, fraction: 0.75}   # 2600 MHz
  - {id: F2,  mode: fixed, fraction: 0.5}    # 2000 MHz
  - {id: F3,  mode: fixed, fraction: 0.25}   # 1400 MHz
  - {id: F4,  mode: fixed, fraction: 0.0}    #  800 MHz

repetitions_per_combination: 6
baseline_repetition_indices: [1]

target_windows_per_repetition: 50
interval_ns: 1000000  # 1 ms

running_ratio_min: 0.90

frequency_validation:
  require_per_window: true
  tolerance_fraction: 0.05
  grace_seconds: 0.15
  tail_grace_seconds: 0.15

frequency_settle:
  enabled: true
  timeout_seconds: 30.0
  tolerance_fraction: 0.05
  poll_interval_seconds: 0.5

turbo:
  require_disabled: true

temperature:
  require_package_sensor: true
  minimum_c: 0
  maximum_c: 90

projected_campaign_bytes: 10737418240
remaining_core_hours: 100000
projected_core_hours: 2

cores:
  delegated_cpus: [0, 1, 2, 3, 4, 5]
  collector_cpu: 6
  consumer_cpu: 7
  numa_node_pin: 0

smt_policy: one_thread_per_physical_core

cgroup_path: null

perf_enabled: true

rapl:
  enabled: true

uncore:
  enabled: true

gpu:
  enabled: false

timeouts_seconds:
  ready: 15
  run: 120
  shutdown: 15

hardware_datasheet:
  bw_pico_bytes_per_s: 59500000000
  p_pico_flops_per_s: 480000000000
