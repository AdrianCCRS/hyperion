# Campana suplementaria "big" REF-only -- eje GPU (2026-08-30).
#
# 9 config_id nuevos (GEMM/Cholesky/FFT, N=8192/12288/16384) x 1 nivel de CPU
# anfitrion (REF) x 1 nivel de GPU (REF) x 3 rep = 27 corridas.
#
# Par exacto de campaign_pacca_dual_cpu_big_ref.yaml: juntas producen las 54
# corridas que cierran la comparacion CPU-REF vs GPU-REF para los 9 tamanos
# nuevos, y con ella el mapa de amortizacion K_break_even (cada corrida
# entrega region cold Y warm). Ver la cabecera del manifiesto de CPU para la
# justificacion completa del diseno REF-only (verificacion 136/136 sobre el
# catalogo actual) y su caveat de extrapolacion a N>=8192.
#
# expected_runtime_seconds de estos 9 kernel_ref GPU se corrigio el
# 2026-08-30: venian heredados literalmente de sus gemelos CPU (p.ej. GEMM
# N=16384 declaraba 412 s, cuando el modelo GPU de dos terminos validado en
# el pase 6689 da ~16 s para sus 5 iteraciones). Sobreestimacion de 17x que
# inflaba el timeout de _resolve_timeout_seconds() y produjo una proyeccion
# de duracion de campana completamente irreal (69-78 h). Los valores actuales
# salen del modelo de dos terminos + arranque CUDA + ~20% de margen.
#
# ADVERTENCIA Roofline: operational_intensity_flops_per_byte de estos 9
# kernel_ref esta HEREDADO de N4096 sin re-perfilar con Nsight Compute. No
# usar para clasificacion Roofline sin perfilar, o excluir explicitamente de
# cualquier afirmacion de regimen. No afecta al objetivo EDP del selector.
#
# USO ESTADISTICO: conjunto CONFIRMATORIO externo, protocolo congelado antes
# de mirar los datos.

