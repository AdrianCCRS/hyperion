# Campaña completa (etiqueta de verdad real, uncore por ventana) sobre
# LULESH y HPCG -- 2do y 3er candidato del pivote de catálogo motivado
# por C8 (Estrategia_CPU_Fase2.md §7.bis), tras el negativo de GAP (job
# 6601). Confirmados en tamizaje (job 6612): LULESH alpha=0.533 r2=0.998,
# HPCG alpha=0.324 r2=0.903 -- ambos en la banda intermedia (0.18-0.6)
# que el catálogo no cubría.
#
# OBJETIVO PRINCIPAL: no es solo margen de EDP (ninguno de los dos cruza
# el umbral 0.226 en alpha agregado), es producir ventanas con mezcla
# real de fase intra-corrida para C8 -- el clasificador de ventana ya
# demostró (npb_lu/npb_bt/3mm_omp) que funciona donde el fenómeno existe;
# esta campaña prueba si LULESH/HPCG lo producen también.
#
# NIVELES: los 5 estándar (REF, F0-F4), no rejilla fina -- sin evidencia
# todavía de que la necesiten.
#
# REPETICIONES: n=6, estándar del proyecto (repetitions_edp.tex).

campaign_id: pacca_cpu_lulesh_hpcg_20260827
environment_tier: hpc_sc3
