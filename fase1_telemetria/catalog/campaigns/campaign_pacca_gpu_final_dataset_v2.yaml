    F0: 53621.8
    G1: 50868.8   # INTERPOLADO
    G2: 48115.8   # INTERPOLADO
    G3: 45362.8   # INTERPOLADO
    G4: 42609.8   # INTERPOLADO
    F1: 39856.8
    F2: 36084.9
    F3: 34441.0
    F4: 33677.6
  active_power_margin_mw:
    REF: 800
    F0: 4000
    G1: 3600      # INTERPOLADO
    G2: 3200      # INTERPOLADO
    G3: 2800      # INTERPOLADO
    G4: 2400      # INTERPOLADO
    F1: 2000
    F2: 1200
    F3: 900
    F4: 800

