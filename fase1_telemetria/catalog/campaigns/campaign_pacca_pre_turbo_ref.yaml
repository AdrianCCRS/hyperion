# Integración de hardware previa al permiso de Turbo. Ejercita el pipeline
# vigente en REF con un extremo memory-bound y los dos kernels nuevos
# compute-bound. No es dataset final ni sustituye el reconocimiento de 90
# combinaciones: no valida actuación ni selección de frecuencias fixed.
campaign_id: pacca_pre_turbo_ref_20260814
environment_tier: hpc_sc3
seed: 20260814

output_dir: /home/latorresn/hyperion-results/validation/pacca_pre_turbo_ref_20260814
overwrite: true
catalog_path: ../catalog.yaml

calibration:
  - kernel_ref: stream_official
  - kernel_ref: ert_probe

kernels:
  - kernel_ref: npb_mg
  - kernel_ref: rodinia_lavamd_omp
  - kernel_ref: rajaperf_polybench_3mm_omp

frequency_levels:
  - {id: REF, mode: native_governor}

repetitions_per_combination: 3
target_windows_per_repetition: 50
interval_ns: 1000000
running_ratio_min: 0.90

# REF carece de objetivo numérico, pero E01 sí exige que toda ventana tenga
# la nueva lectura real scaling_cur_freq_khz.
frequency_validation:
  require_per_window: true
  tolerance_fraction: 0.05

turbo:
  require_disabled: false

temperature:
  require_package_sensor: true
  minimum_c: 0
  maximum_c: 90

projected_campaign_bytes: 2147483648
remaining_core_hours: 100000
projected_core_hours: 10

cores:
  delegated_cpus: [0, 1, 2, 3, 4, 5]
  collector_cpu: 6
  consumer_cpu: 7
  numa_node_pin: 0

smt_policy: one_thread_per_physical_core
cgroup_path: null
perf_enabled: true

rapl:
  enabled: true

uncore:
  enabled: true

gpu:
  enabled: false

timeouts_seconds:
  ready: 15
  run: 180
  shutdown: 15

hardware_datasheet:
  bw_pico_bytes_per_s: 59500000000
  p_pico_flops_per_s: 480000000000
