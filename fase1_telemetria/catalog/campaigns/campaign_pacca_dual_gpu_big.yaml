# Campana suplementaria "big" del selector CPU/GPU -- eje GPU (2026-08-30).
# 9 config_id nuevos (GEMM/Cholesky/FFT, N=8192/12288/16384) x 4 niveles
# reducidos de CPU x 8 niveles finos de GPU x 3 rep = 864 corridas.
# Identidad propia (campaign_id + output_dir nuevos) por la misma razon que
# campaign_pacca_dual_cpu_big.yaml: agregar estos kernel_ref al manifiesto
# campaign_pacca_dual_gpu_full.yaml (con corridas ya aceptadas) cambia
# compute_protocol_fingerprint() -- orchestrator/campaign.py ~L81 -- y
# dispara CampaignProtocolMismatchError. Ver ese manifiesto para el
# contexto completo; este archivo replica su estructura (cores, gpu block,
# hardware_datasheet, idle_power_mw_by_level) sin cambios sustantivos --
# son propiedades de la plataforma paccaA100, no del tamano del kernel.
#
# El dataset combinado (68 + 9 = 77 config_id) se arma en
# classifier/selector build pasando ambos output_dir del eje GPU -- ver
# classifier/selector/cli.py / dataset.py.
#
# Presupuesto de tiempo: ver run_campaign_pacca_dual_gpu_big.sbatch.

campaign_id: pacca_dual_gpu_big_20260830
environment_tier: hpc_sc3
seed: 20260830

output_dir: /home/latorresn/hyperion-results/campaigns/pacca_dual_gpu_big_20260830
overwrite: true

catalog_path: ../catalog.yaml

calibration:
  - kernel_ref: stream_official
  - kernel_ref: ert_probe

kernels:
  - kernel_ref: dual_gemm_gpu_N8192
  - kernel_ref: dual_gemm_gpu_N12288
  - kernel_ref: dual_gemm_gpu_N16384
  - kernel_ref: dual_fft_gpu_N8192
  - kernel_ref: dual_fft_gpu_N12288
  - kernel_ref: dual_fft_gpu_N16384
  - kernel_ref: dual_cholesky_gpu_N8192
  - kernel_ref: dual_cholesky_gpu_N12288
  - kernel_ref: dual_cholesky_gpu_N16384

frequency_levels:
  - {id: REF, mode: native_governor}
  - {id: F0, mode: fixed, fraction: 1.0}
  - {id: F3, mode: fixed, fraction: 0.5}
  - {id: F6, mode: fixed, fraction: 0.0}

gpu_frequency_levels:
  - {id: REF, mode: native_governor}
  - {id: F0, mode: fixed, fraction: 1.0}
  - {id: F1, mode: fixed, fraction: 0.833}
  - {id: F2, mode: fixed, fraction: 0.667}
  - {id: F3, mode: fixed, fraction: 0.5}
  - {id: F4, mode: fixed, fraction: 0.333}
  - {id: F5, mode: fixed, fraction: 0.167}
  - {id: F6, mode: fixed, fraction: 0.0}

repetitions_per_combination: 3
baseline_repetition_indices: [1]
target_windows_per_repetition: 5
interval_ns: 1000000  # 1 ms
gpu_interval_ns: 5000000  # 5 ms

running_ratio_min: 0.90

frequency_validation:
  require_per_window: true
  tolerance_fraction: 0.05
  grace_seconds: 0.05

cores:
  delegated_cpus: [0, 1, 2, 3, 4, 5]
  collector_cpu: 6
  consumer_cpu: 7
  numa_node_pin: 0

smt_policy: one_thread_per_physical_core

cgroup_path: null

perf_enabled: true

frequency_settle:
  enabled: true
  timeout_seconds: 30.0
  tolerance_fraction: 0.05
  poll_interval_seconds: 0.5

rapl:
  enabled: true

uncore:
  enabled: true

turbo:
  require_disabled: true

temperature:
  require_package_sensor: true
  minimum_c: 0
  maximum_c: 90

gpu:
  enabled: true
  calibration:
    - gpu_stream_bw
    - gpu_ert_probe_fp32
    - gpu_ert_probe_fp64
  # Mismos anclajes de reposo que campaign_pacca_dual_gpu_full.yaml (job
  # 6714): propiedad de la plataforma, no del kernel -- reusados sin
  # cambios.
  idle_power_mw_by_level:
    REF: 34837.9
    F0: 56565.5
    F1: 45052.4
    F2: 38466.0
    F3: 36941.6
    F4: 35369.0
    F5: 34837.9
    F6: 34368.9
  active_power_margin_mw:
    REF: 800.0
    F0: 4000.0
    F1: 2700.0
    F2: 1720.0
    F3: 1200.0
    F4: 1005.0
    F5: 865.0
    F6: 800.0

timeouts_seconds:
  ready: 15
  run: 180
  shutdown: 15

hardware_datasheet:
  bw_pico_bytes_per_s: 59500000000
  p_pico_flops_per_s: 509083000000

projected_campaign_bytes: 400000000
remaining_core_hours: 1000.0
